/* Life OS — GitHub Pages edition */
:root{--bg:#E3E7DE;--card:#fff;--sand:#E2D5BB;--olive:#b9b560;--terra:#aa6d51;--ink:#263323;--muted:#818779;--line:#e9ece5;--shadow:0 12px 34px #39433312}
body{background:radial-gradient(ellipse at 12% 0%,#f7f7f1 0,transparent 34%),var(--bg);letter-spacing:-.015em}
.app{max-width:1440px;padding:24px 30px 38px}
.top{align-items:flex-start;gap:24px;margin-bottom:22px}
.brand{font-size:25px;letter-spacing:-.06em;color:var(--ink);white-space:nowrap}
.brand span{color:var(--terra)}
.nav{gap:6px;justify-content:flex-end}
.nav button{border-radius:30px;background:#ffffffb8;color:#53604e;padding:10px 14px;font-size:12px;transition:.2s}
.nav button.active{background:var(--ink);color:#fff;box-shadow:0 5px 15px #26332325}
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#e8d4c5 0%,#e6dfc9 47%,#c9cba9 100%);border:1px solid #ffffffa6;min-height:190px;padding:30px 34px;border-radius:30px;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff55;border-radius:50%;right:12%;top:-160px;box-shadow:0 0 0 24px #ffffff15,0 0 0 50px #ffffff10}
.hero h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.06em;color:#263323;margin:8px 0}
.hero>div:first-child{position:relative;z-index:1}
.dogbox{position:relative;z-index:1;min-width:min(46%,430px);gap:16px}
.track{height:94px;border-bottom:2px dashed #fff9;min-width:210px}
.dog{position:absolute;left:0;bottom:-3px;width:82px;height:78px;transition:left .65s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 5px 3px #26332320);overflow:visible}
.dog.running{animation:dogRun .42s ease-in-out 3}
@keyframes dogRun{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-9px) rotate(-4deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-5px) rotate(-2deg)}}
.ball{position:absolute;right:0;bottom:0;font-size:25px;filter:drop-shadow(0 3px 2px #3332)}
.dogscore{min-width:76px}
.card{border:1px solid #fff;box-shadow:var(--shadow);border-radius:24px;padding:22px;transition:transform .18s,box-shadow .18s}
.card h2{font-size:18px;letter-spacing:-.04em;color:var(--ink)}
button{background:var(--sand);border-radius:14px;transition:transform .15s,filter .15s}
button:active{transform:scale(.97)}
button.soft,.nav button{background:#f2f4ee}
button.danger{background:#f4e7df;color:#925d48}
input,textarea,select{border-color:#e8ebe3;border-radius:13px}
input:focus,textarea:focus,select:focus{border-color:var(--olive);box-shadow:0 0 0 3px #b9b56020}
.pill{background:#f1f0e4;color:#62634b}
.progress b{background:linear-gradient(90deg,var(--terra),var(--olive))}
.item{gap:11px}
.item button{padding:7px 10px}
.subcard{background:#f7f8f4;border:1px solid #edf0e9;border-radius:18px}
.english-text{background:#f7f8f4;border:1px solid #edf0e9}
.footer{padding-bottom:18px}
@media(min-width:761px){
 .app{display:grid;grid-template-columns:220px minmax(0,1fr);column-gap:24px}
 .top{grid-column:1;grid-row:1 / span 3;position:sticky;top:18px;display:flex;flex-direction:column;align-items:stretch;height:calc(100vh - 36px);padding:18px 12px;background:#ffffffa6;border:1px solid #fff;border-radius:26px;box-shadow:var(--shadow)}
 .top .nav{display:flex;flex-direction:column;align-items:stretch;margin-top:20px}
 .top .nav button{text-align:left;padding:13px 15px}
 .hero{grid-column:2;grid-row:1}
 #main{grid-column:2;grid-row:2}
 .footer{grid-column:2;grid-row:3}
 .tabs{display:none!important}
}
@media(max-width:760px){
 .app{padding:12px 12px 96px}
 .top{display:block;padding:5px 3px}
 .brand{font-size:22px}
 .top .nav{display:none}
 .hero{padding:22px 20px;min-height:0}
 .hero h1{font-size:30px}
 .dogbox{min-width:0;margin-top:18px}
 .track{height:84px}
 .dog{width:76px;height:73px}
 .card{padding:17px;border-radius:21px}

 .tabs button{border-radius:13px;min-width:58px;font-size:10px;color:#56604f}
 .tabs button.active{background:var(--ink);color:white}
 .footer{padding-bottom:10px}
}

.habit-fill{width:100%;background:#b9b560;border-radius:8px 8px 0 0}

.calendar-day.has-content{background:#b9b560}

.workout-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.workout-options label{background:#E8D2B8;border:1px solid #aa6d51;padding:11px;border-radius:12px;font-weight:700}
.workout-options input{width:auto}
.phase-box{background:#b9b560;padding:15px;border-radius:16px;margin-top:15px;color:#30251F}
.stats-chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.vision-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px;padding:18px;background:#E8D2B8;border:4px solid #aa6d51;border-radius:14px;box-shadow:inset 0 0 0 5px #b9b560}
.vision-pin{background:#FFF9EF;padding:12px;border:2px solid #b9b560;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #aa6d51}
.vision-pin .photo{height:auto;min-height:110px}
.vision-pin .photo img{object-fit:contain;max-height:260px}
.flashcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:12px 0}
.flashcard{min-height:125px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#b9b560!important;color:#30251F!important;border:2px solid #aa6d51}
.flashcard.revealed{background:#E8D2B8!important}

.reward-tier small{display:block;font-size:11px;font-weight:500}

<div class="workspace-modal" id="congratsModal" hidden><div class="workspace-sheet" style="height:auto;max-width:520px;align-self:center;text-align:center;padding:38px 24px"><div style="font-size:58px">🐶✨</div><h1 style="color:#aa6d51">Ты молодец!</h1><p>Ты выполнила все задания на сегодня. День закрыт — собачка дошла до финиша! ❤️</p><button onclick="closeCongrats()">Начать новый день</button></div></div>
<script>
const sections=[['home','Главная','⌂'],['tasks','Неделя','▦'],['habits','Привычки','✓'],['work','Работа','✦'],['english','English','A'],['health','Здоровье','♡'],['life','Моя жизнь','☼']];
const defaults={tasks:[],workDocs:[],content:[],workouts:[],habits:[{name:'Спорт · 1 час в день',log:{}},{name:'Mind saturation session · 1 час',log:{}},{name:'Просыпаться в 7:00',log:{}}],projects:[],dictionary:[],ideas:[],posts:[],wishlist:[],vision:[],affirmations:[],rewards:[],spent:[],journal:{},energy:{},englishLevel:0,focusTotal:0,focusSessions:[],points:0,closedDays:[],health:{},notes:{}};
let data=load(),page='home',timer=null,remaining=0,focusStarted=null;
function load(){try{let d={...structuredClone(defaults),...JSON.parse(localStorage.getItem('lifeos')||'{}')};['workDocs','content','workouts'].forEach(k=>d[k]??=[]);return d}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem('lifeos',JSON.stringify(data));renderHeader()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Date.now()+Math.random().toString(16).slice(2)}
function today(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function nav(){let h=sections.map(([k,n,ic])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${ic} ${n}</button>`).join('');document.getElementById('topnav').innerHTML=h;document.getElementById('bottomnav').innerHTML=h}
function go(p){page=p;nav();render()}
let lastDogDone=-1;
function renderHeader(){document.getElementById('today').textContent=fmt(today());let hr=new Date().getHours();document.getElementById('greeting').textContent=(hr<12?'Доброе утро':hr<18?'Хорошего дня':'Добрый вечер')+'!';document.getElementById('points').textContent=data.points||0;let todays=data.tasks.filter(t=>t.date===today()),total=todays.length,done=todays.filter(t=>t.done).length,pct=total?done/total:0;let dog=document.getElementById('dog'),track=document.getElementById('dogtrack');if(dog&&track){let max=Math.max(0,track.clientWidth-dog.offsetWidth-4);dog.style.left=(max*pct)+'px';document.getElementById('dogstage').textContent=total?(done===total?'Финиш! Все планы выполнены 🏆':`${done} из ${total} · ${Math.round(pct*100)}%`):'План на день только начинается';if(lastDogDone!==-1&&done>lastDogDone){dog.classList.remove('running');void dog.getBoundingClientRect();dog.classList.add('running')}lastDogDone=done}}
function addTask(){let text=document.getElementById('newtask').value.trim();if(!text)return;let t={id:id(),text,date:document.getElementById('taskdate').value||today(),slot:document.getElementById('taskslot').value,category:document.getElementById('taskcategory').value,done:false};routeWorkTask(t);data.tasks.push(t);save();render()}
function toggleTask(i){let t=data.tasks[i];t.done=!t.done;if(t.done)bark();data.points=Math.max(0,(data.points||0)+(t.done?1:-1));save();render();if(t.done){let todays=data.tasks.filter(x=>x.date===today());if(todays.length&&todays.every(x=>x.done))celebrateDogFinish()}}
function celebrateDogFinish(){let key='lifeos_dog_finish_v3_'+today();if(localStorage.getItem(key))return;localStorage.setItem(key,'1');let dog=document.getElementById('dog');if(dog){dog.classList.remove('running');void dog.offsetWidth;dog.classList.add('running')}bark();setTimeout(bark,420)}
function delTask(i){data.tasks.splice(i,1);save();render()}
function editTask(i){let t=data.tasks[i],v=prompt('Изменить задачу',t.text);if(v!==null){t.text=v;save();render()}}
function addHabit(){let v=document.getElementById('habitnew').value.trim();if(v){data.habits.push({name:v,log:{}});save();render()}}
function habitToggle(i){let h=data.habits[i],d=today();h.log[d]=!h.log[d];save();render()}
function habitStreak(h){let n=0,d=new Date();while(h.log[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}
function closeDay(){let todays=data.tasks.filter(t=>t.date===today()),done=todays.filter(t=>t.done).length;if(!todays.length){alert('Сначала добавь планы на сегодня.');return}if(done!==todays.length){alert(`Осталось выполнить ${todays.length-done} задач. Когда всё будет отмечено, можно закрыть день ❤️`);return}if(!data.closedDays.includes(today())){data.closedDays.push(today());save();bark();showCongrats()}else alert('Этот день уже закрыт. Ты большая молодец!')}
function addProject(){let n=prompt('Название нового проекта');if(n&&n.trim()){data.projects.push({id:id(),name:n.trim(),folders:['Основные материалы','Юридическая часть','Сторителлинги','Продуктовая линейка','Ценовая декомпозиция','Прогрев','Как улучшить','Другое'].map(name=>({name,notes:''}))});save();render()}}
function projectEdit(i){let n=prompt('Название проекта',data.projects[i].name);if(n){data.projects[i].name=n;save();render()}}
function folderEdit(pi,fi){let f=data.projects[pi].folders[fi],v=prompt(f.name+' — материалы и заметки',f.notes);if(v!==null){f.notes=v;save();render()}}
function addWord(){let w=document.getElementById('word').value.trim(),tr=document.getElementById('translation').value.trim();if(w&&tr){data.dictionary.push({w,tr,emoji:document.getElementById('emoji').value||'💡'});save();render()}}
function addIdea(){let v=document.getElementById('idea').value.trim();if(v){data.ideas.push(v);save();render()}}
function addWish(){let v=document.getElementById('wish').value.trim(),file=document.getElementById('wishfile').files[0];if(!v)return;let add=photo=>{data.wishlist.push({id:id(),name:v,price:0,saved:0,photo});save();render()};if(file){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(file)}else add('')}
function addReward(){let n=document.getElementById('rewardname').value.trim(),p=+document.getElementById('rewardprice').value;if(n&&p>0){data.rewards.push({name:n,price:p});save();render()}}
function redeem(i){let r=data.rewards[i];if(data.points>=r.price&&confirm('Обменять '+r.price+' баллов на «'+r.name+'»?')){data.points-=r.price;data.spent.push({name:r.name,date:today()});save();render()}else if(data.points<r.price)alert('Пока не хватает баллов 💛')}
function addVision(){let title=document.getElementById('visiontitle').value.trim(),aff=document.getElementById('visionaff').value.trim(),file=document.getElementById('visionfile').files[0];if(!title)return;let add=url=>{data.vision.push({title,aff,url});save();render()};if(file){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(file)}else add('')}
function addAff(){let v=document.getElementById('aff').value.trim();if(v){data.affirmations.push(v);save();render()}}
function addPost(){let platform=document.getElementById('platform').value,title=document.getElementById('posttitle').value.trim(),date=document.getElementById('postdate').value,script=document.getElementById('postscript').value.trim();if(title){data.content.push({id:id(),platform,title,date,script});save();render()}}
function addFocus(){let mins=+document.getElementById('focusmins').value||25;if(timer)clearInterval(timer);remaining=mins*60;focusStarted=Date.now();document.getElementById('timerdisplay').textContent=clock(remaining);timer=setInterval(()=>{remaining--;document.getElementById('timerdisplay').textContent=clock(remaining);if(remaining<=0){clearInterval(timer);timer=null;finishFocus('Фокус',mins);alert('Фокус-сессия завершена! Отличная работа.')}},1000);document.getElementById('timerstatus').textContent='Время для себя и важного дела'}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stopFocus(){if(timer){clearInterval(timer);timer=null;let elapsed=Math.max(1,Math.round((Date.now()-focusStarted)/60000));finishFocus('Фокус',elapsed);document.getElementById('timerstatus').textContent='Сессия остановлена'}}
function finishFocus(task,mins){data.focusTotal+=mins;data.focusSessions.push({date:today(),task,mins});save()}

function routeWorkTask(t){if(t.category!=='Работа')return;let p=data.projects.find(x=>x.name==='Работа');if(!p){p={id:id(),name:'Работа',folders:[]};data.projects.push(p)}let d={id:id(),projectId:p.id,title:t.text,body:'Задача из планировщика: '+t.text};data.workDocs.push(d);t.docId=d.id}
function newWorkDoc(i){let p=data.projects[i],title=prompt('Название документа');if(!title||!title.trim())return;let d={id:id(),projectId:p.id,title:title.trim(),body:''};data.workDocs.push(d);save();render();editWorkDoc(d.id)}
function editWorkDoc(docId){let d=data.workDocs.find(x=>x.id===docId);if(!d)return;openWorkspaceEditor({kind:'doc',id:docId,title:d.title,body:d.body||''})}
function viewContent(contentId){let x=data.content.find(c=>c.id===contentId);if(x)openWorkspaceEditor({kind:'content',id:contentId,title:x.title,body:x.script||'',meta:`${x.date||''} · ${x.platform||''}`})}
function openWorkspaceEditor(item){let modal=document.getElementById('workspaceModal');if(!modal)return;modal.dataset.kind=item.kind;modal.dataset.id=item.id;document.getElementById('workspaceTitle').value=item.title||'';document.getElementById('workspaceText').value=item.body||'';document.getElementById('workspaceMeta').textContent=item.meta||'Документ сохраняется автоматически';document.getElementById('workspaceStatus').textContent='Все изменения сохраняются автоматически';modal.hidden=false;document.body.style.overflow='hidden'}
function saveWorkspaceEditor(){let modal=document.getElementById('workspaceModal');if(!modal||modal.hidden)return;let kind=modal.dataset.kind,idv=modal.dataset.id,title=document.getElementById('workspaceTitle').value.trim(),body=document.getElementById('workspaceText').value;if(kind==='doc'){let d=data.workDocs.find(x=>x.id===idv);if(d){d.title=title||'Без названия';d.body=body}}else if(kind==='content'){let x=data.content.find(c=>c.id===idv);if(x){x.title=title||'Без названия';x.script=body}}save();document.getElementById('workspaceStatus').textContent='Сохранено · '+new Date().toLocaleTimeString('ru-RU')}
function closeWorkspaceEditor(){saveWorkspaceEditor();document.getElementById('workspaceModal').hidden=true;document.body.style.overflow='';render()}
function showCongrats(){let modal=document.getElementById('congratsModal');if(modal){modal.hidden=false;document.body.style.overflow='hidden'}}
function closeCongrats(){document.getElementById('congratsModal').hidden=true;document.body.style.overflow='';render()}
let pendingWorkout=[];
function selectWorkout(type,checked){if(checked&&!pendingWorkout.includes(type))pendingWorkout.push(type);if(!checked)pendingWorkout=pendingWorkout.filter(x=>x!==type)}
function saveWorkouts(){let types=[...pendingWorkout],d=today();data.health[d]??={training:[]};data.health[d].training=types;data.workouts=data.workouts.filter(x=>x.date!==d);if(types.length)data.workouts.push({date:d,types});types.forEach(type=>{let habitName='Тренировка: '+type,habit=data.habits.find(x=>x.name===habitName);if(!habit){habit={name:habitName,log:{}};data.habits.push(habit)}habit.log[d]=true});data.habits.filter(x=>x.name.startsWith('Тренировка: ')&&!types.includes(x.name.slice(12))).forEach(x=>{x.log[d]=false});save();render();bark();alert('Тренировка сохранена! Динамика обновлена ❤️')}
function speakEnglish(text){if(!('speechSynthesis'in window))return;let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=1;u.pitch=1;let choose=()=>{let voices=speechSynthesis.getVoices();let v=voices.find(x=>/^en-US/i.test(x.lang)&&/natural|enhanced|premium/i.test(x.name))||voices.find(x=>/^en-US/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));if(v)u.voice=v};choose();speechSynthesis.cancel();speechSynthesis.speak(u);if(speechSynthesis.pending){speechSynthesis.resume()}}
function addFlashcard(){let w=document.getElementById('flashword').value.trim(),tr=document.getElementById('flashtranslation').value.trim();if(w&&tr){data.flashcards??=[];data.flashcards.push({w,tr});save();render()}}
function claimTier(name,price){if(data.points<price)return; if(confirm('Получить награду «'+name+'» за '+price+' баллов?')){data.points-=price;data.spent.push({name,date:today()});save();render()}}

function render(){
renderHeader();nav();let m=document.getElementById('main');
if(page==='home')m.innerHTML=home();
if(page==='tasks')m.innerHTML=tasksPage();
if(page==='habits')m.innerHTML=habitsPage();
if(page==='work')m.innerHTML=workPage();
if(page==='english')m.innerHTML=englishPage();
if(page==='health')m.innerHTML=healthPage();
if(page==='life')m.innerHTML=lifePage();


}
function home(){let todays=data.tasks.filter(t=>t.date===today()),done=todays.filter(t=>t.done).length,energy=data.energy[today()]||{e:3,m:3,main:''},journal=data.journal[today()]||{good:'',move:''};return `<div class="grid">
<div class="card s8"><div class="bar"><h2>☀️ Старт дня</h2><span class="pill">${done}/${todays.length} задач</span></div><div class="row"><label class="tiny">Энергия · 1–5<input type="range" min="1" max="5" value="${energy.e}" oninput="setEnergy('e',this.value)"></label><label class="tiny">Настроение · 1–5<input type="range" min="1" max="5" value="${energy.m}" oninput="setEnergy('m',this.value)"></label></div><p class="tiny">Главное дело дня</p><input value="${esc(energy.main)}" placeholder="Самое важное сегодня…" onchange="setEnergy('main',this.value)"><h3 style="margin-top:20px">План на сегодня</h3>${taskRows(todays)}<div class="formline"><input id="newtask" placeholder="Добавить задачу…"><input id="taskdate" type="date" value="${today()}"><select id="taskslot"><option>Утро</option><option>День</option><option>Вечер</option></select><select id="taskcategory"><option>Бытовуха</option><option>Работа</option><option>Духовность</option><option>Спорт</option><option>Друзья</option><option>Отдых</option><option>Развлечения</option></select><button onclick="addTask()">＋</button></div></div>
<div class="card s4"><h2>⏱ Фокус</h2><div class="stat" id="timerdisplay">25:00</div><p class="tiny" id="timerstatus">Время фокуса за всё время: ${data.focusTotal} мин</p><input id="focusmins" type="number" min="1" value="25" placeholder="Минуты"><div class="formline"><button onclick="addFocus()">Старт</button><button class="danger" onclick="stopFocus()">Стоп</button></div></div>
<div class="card s6"><h2>🌱 Привычки сегодня</h2>${data.habits.slice(0,5).map((h,i)=>`<div class="item"><input type="checkbox" ${h.log[today()]?'checked':''} onchange="habitToggle(${i})"><span class="txt">${esc(h.name)}</span><span class="pill">🔥 ${habitStreak(h)}</span></div>`).join('')||'<p class="muted">Добавь привычки в соответствующем разделе.</p>'}<button class="soft" onclick="go('habits')">Все привычки →</button></div>
<div class="card s6"><h2>📖 English word</h2>${data.dictionary.length?`<div class="stat">${esc(data.dictionary[data.dictionary.length-1].emoji)} ${esc(data.dictionary[data.dictionary.length-1].w)}</div><p>${esc(data.dictionary[data.dictionary.length-1].tr)}</p>`:'<p class="muted">Добавь слова в разделе English — они появятся здесь.</p>'}<button class="soft" onclick="go('english')">Учить английский →</button></div>
<div class="card s12"><h2>🌙 Итог дня</h2><div class="row"><label class="tiny">Что получилось?<textarea onchange="setJournal('good',this.value)">${esc(journal.good)}</textarea></label><label class="tiny">Что перенести / улучшить?<textarea onchange="setJournal('move',this.value)">${esc(journal.move)}</textarea></label></div><button onclick="closeDay()">Закрыть день · я всё выполнила</button></div></div>`}
function setEnergy(k,v){data.energy[today()]??={e:3,m:3,main:''};data.energy[today()][k]=k==='main'?v:+v;save()}
function setJournal(k,v){data.journal[today()]??={good:'',move:''};data.journal[today()][k]=v;save()}
function taskRows(arr){return arr.length?arr.map(t=>{let i=data.tasks.indexOf(t);return `<div class="item ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><span class="txt">${esc(t.text)} <span class="tiny">· ${esc(t.slot||'')} · <b>${esc(t.category||'Бытовуха')}</b></span></span><button class="soft" onclick="editTask(${i})">✎</button>${t.docId?`<button class="soft" onclick="editWorkDoc('${t.docId}')">📄</button>`:''}<button class="danger" onclick="delTask(${i})">×</button></div>`}).join(''):'<p class="muted">Пока задач нет — добавь первую ниже.</p>'}

function workPage(){let month=new Date().toISOString().slice(0,7),events=data.content.filter(x=>(x.date||'').startsWith(month));return `<div class="grid"><div class="card s5"><div class="bar"><h2>📁 Проекты и документы</h2><button onclick="addProject()">＋ Проект</button></div><p class="tiny">В каждом проекте создавай документы, записывай идеи и возвращайся к ним в любое время.</p>${data.projects.map((p,i)=>`<div class="subcard" style="margin:8px 0"><div class="bar"><b>${esc(p.name)}</b><button class="soft" onclick="projectEdit(${i})">✎</button></div><button onclick="newWorkDoc(${i})">＋ Новый документ</button>${data.workDocs.filter(d=>d.projectId===p.id).map(d=>`<div class="item"><span class="txt">📄 ${esc(d.title)}</span><button class="soft" onclick="editWorkDoc('${d.id}')">Открыть</button></div>`).join('')}<button class="danger" onclick="if(confirm('Удалить проект и его документы?')){let pid=data.projects[${i}].id;data.projects.splice(${i},1);data.workDocs=data.workDocs.filter(d=>d.projectId!==pid);save();render()}">Удалить проект</button></div>`).join('')||'<p class="muted">Создай первый проект.</p>'}</div><div class="card s7"><h2>📝 Документы</h2>${data.workDocs.map(d=>`<div class="item"><span class="txt"><b>${esc(d.title)}</b><span class="tiny"> · ${esc((data.projects.find(p=>p.id===d.projectId)||{}).name||'Проект удалён')}</span></span><button class="soft" onclick="editWorkDoc('${d.id}')">Открыть</button></div>`).join('')||'<p class="muted">Документы появятся здесь.</p>'}<h2 style="margin-top:24px">📣 Контент-план</h2><p class="tiny">Добавляй сценарии — они сохранятся в календаре раздела «Работа».</p><div class="formline"><select id="platform"><option>Instagram</option><option>YouTube</option><option>Telegram</option><option>TikTok</option></select><input id="posttitle" placeholder="Тема / название контента"><input id="postdate" type="date" value="${today()}"></div><textarea id="postscript" placeholder="Сценарий, текст, заметки к публикации…"></textarea><button onclick="addPost()">Сохранить в календарь</button><h3 style="margin-top:22px">🗓 Календарь контента · ${new Date().toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h3><div class="content-calendar">${Array.from({length:new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()},(_,i)=>{let day=month+'-'+String(i+1).padStart(2,'0'),items=data.content.filter(x=>x.date===day);return `<div class="calendar-day ${items.length?'has-content':''}"><b>${i+1}</b>${items.map(x=>`<button class="calendar-event" onclick="viewContent('${x.id}')">${esc(x.platform)} · ${esc(x.title)}</button>`).join('')}</div>`}).join('')}</div><h3>Все публикации</h3>${events.map(x=>`<div class="item"><span class="txt"><b>${esc(x.date)}</b> · ${esc(x.platform)} · ${esc(x.title)}</span><button class="soft" onclick="viewContent('${x.id}')">Открыть</button><button class="danger" onclick="data.content=data.content.filter(c=>c.id!=='${x.id}');save();render()">×</button></div>`).join('')}</div></div>`}
const lessons=[{title:'A day that went well',text:'Yesterday, I had a busy but lovely day. I woke up early and made a simple breakfast. After that, I worked on an important project and answered a few messages. In the afternoon, I went for a walk because I wanted to get some fresh air. In the evening, I studied English for thirty minutes. I felt proud because I finished the most important tasks.' ,q:'What did the person do in the afternoon?',a:'went for a walk',level:'A2'},{title:'Building a better routine',text:'A good routine does not need to be perfect. It is more useful to choose a few small habits and repeat them regularly. For example, you can plan your day in the morning, take short breaks, and read a little before bed. When you miss a day, do not give up. Notice what made it difficult and try again tomorrow. Progress often comes from simple actions.' ,q:'What should you do if you miss a day?',a:'try again tomorrow',level:'A2+'},{title:'Learning through experience',text:'When people learn a new skill, they often expect quick results. However, real progress usually takes time. It helps to set a clear goal, practise consistently, and reflect on what is working. Mistakes are not a sign of failure; they show us what we still need to understand. Over time, small improvements can lead to meaningful changes.' ,q:'What can mistakes show us?',a:'what we still need to understand',level:'B1'},{title:'Making thoughtful decisions',text:'Before making an important decision, it can be helpful to consider both short-term comfort and long-term benefits. Asking for advice may offer a fresh perspective, but the final choice should reflect your own priorities. You do not need to predict every possible outcome. Instead, gather enough information, think about the risks, and choose the next practical step.' ,q:'What should the final choice reflect?',a:'your own priorities',level:'B1+'}];

function addWordsToFolder(fid){let folder=(data.englishFolders||[]).find(x=>x.id===fid);if(!folder)return;let raw=document.getElementById('words_'+fid).value.trim();if(!raw)return;raw.split(/\n+/).forEach(line=>{let parts=line.split(/\\s*[—–-]\\s*/);if(parts[0]&&parts[1])folder.words.push({w:parts[0].trim(),tr:parts.slice(1).join(' — ').trim()})});save();render()}

function englishPage(){let ix=Math.min(lessons.length-1,data.englishLevel||0),l=lessons[ix];data.englishFolders??=[];let folders=data.englishFolders;return `<div class="grid"><div class="card s8"><div class="bar"><h2>🇬🇧 Английский · ${l.level}</h2><span class="pill">30 минут в день</span></div><h3>${l.title}</h3><div class="english-text">${l.text.split(' ').map(w=>`<span>${esc(w)} </span>`).join('')}</div><p><b>Вопрос:</b> ${l.q}</p><input id="answer" placeholder="Write your answer in English"><div class="formline"><button onclick="let a=document.getElementById('answer').value.toLowerCase();alert(a.includes('${l.a}')?'Отлично! Правильно 🎉':'Попробуй ещё раз. Подсказка: ответ есть в тексте.')">Проверить ответ</button><button class="soft" onclick="data.englishLevel=Math.min(3,(data.englishLevel||0)+1);save();render()">Следующий уровень →</button></div><button class="soft" onclick="speakEnglish(${JSON.stringify(l.text)})">🔊 Прослушать текст</button><h3 style="margin-top:22px">📂 Мои папки со словами</h3><p class="tiny">Создай тематические папки — например, «Путешествия», «Работа», «Повседневные слова». Добавляй слова строками в формате: <b>word — перевод</b>.</p><div class="formline"><input id="englishFolderName" placeholder="Название новой папки"><button onclick="createEnglishFolder()">＋ Создать папку</button></div>${folders.map(f=>`<div class="subcard" style="margin:12px 0"><div class="bar"><h3>📁 ${esc(f.name)}</h3><span class="pill">${f.words.length} слов</span></div><div class="formline"><select onchange="setEnglishMethod('${f.id}',this.value)"><option value="cards" ${f.method==='cards'?'selected':''}>Карточки: увидеть и вспомнить</option><option value="typing" ${f.method==='typing'?'selected':''}>Активное вспоминание: написать перевод</option><option value="quiz" ${f.method==='quiz'?'selected':''}>Мини-тест: выбрать перевод</option></select></div><textarea id="words_${f.id}" placeholder="apple — яблоко&#10;to improve — улучшать"></textarea><button onclick="addWordsToFolder('${f.id}')">Добавить слова в папку</button><button class="soft" onclick="importDictionaryToFolder('${f.id}')">Добавить слова из общего словаря</button><button class="danger" onclick="deleteEnglishFolder('${f.id}')">Удалить папку</button>${f.words.length?`<div class="flashcards">${f.words.map((w,i)=>{let opts=[w.tr,...f.words.filter((x,j)=>j!==i).map(x=>x.tr)].slice(0,4);if(opts.length<2)opts.push('Попробуй вспомнить самостоятельно');return f.method==='cards'?`<button class="flashcard" onclick="this.classList.toggle('revealed');this.querySelector('.answer-side').textContent=this.classList.contains('revealed')?'${esc(w.tr)}':'Нажми, чтобы увидеть перевод'"><b>${esc(w.w)}</b><span class="answer-side">Нажми, чтобы увидеть перевод</span><small onclick="event.stopPropagation();speakEnglish('${esc(w.w)}')">🔊 Произношение</small></button>`:f.method==='typing'?`<div class="flashcard" style="padding:12px"><b>${esc(w.w)}</b><input id="enganswer_${f.id}_${i}" placeholder="Напиши перевод"><button onclick="englishCheckTyping('${f.id}',${i})">Проверить</button><small id="engfeedback_${f.id}_${i}"></small><small onclick="speakEnglish('${esc(w.w)}')">🔊 Слушать</small></div>`:`<div class="flashcard" style="padding:12px"><b>${esc(w.w)}</b><select id="engquiz_${f.id}_${i}"><option value="">Выбери перевод</option>${opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select><button onclick="document.getElementById('engquizfeedback_${f.id}_${i}').textContent=document.getElementById('engquiz_${f.id}_${i}').value==='${esc(w.tr)}'?'Верно! 🎉':'Попробуй ещё раз';if(document.getElementById('engquiz_${f.id}_${i}').value==='${esc(w.tr)}')bark()">Проверить</button><small id="engquizfeedback_${f.id}_${i}"></small></div>`}).join('')}</div>`:'<p class="muted">В этой папке пока нет слов.</p>'}<div class="tiny">Совет: сначала попробуй вспомнить ответ, только потом открывай карточку или проверяй себя.</div></div>`).join('')||'<p class="muted">Создай первую папку, чтобы собрат function healthPage(){let h=data.health[today()]||{training:[]};let len=data.cycleLen||28,start=data.cycleStart,day=start?((Math.floor((new Date(today())-new Date(start+'T00:00:00'))/86400000)%len)+len)%len+1:null,phase=day?(day<=5?'Менструальная фаза':day<=(len/2-2)?'Фолликулярная фаза':day<=(len/2+2)?'Овуляторное окно':'Лютеиновая фаза'):null,choices=['Талия / живот','Попа','Ноги','Растяжка','Спина / грудь','Вумен момент'],month=today().slice(0,7),done=data.workouts.filter(x=>(x.date||'').startsWith(month));pendingWorkout=[...(h.training||[])];let counts=choices.map(c=>done.filter(x=>(x.types||[]).includes(c)).length),max=Math.max(1,...counts),advice=!phase?'Укажи начало последнего цикла — появятся ориентировочные рекомендации.':phase==='Менструальная фаза'?'Мягкая активность по самочувствию: прогулка, лёгкая растяжка. Не перегружайся, если есть боль или слабость.':phase==='Фолликулярная фаза'?'Если самочувствие хорошее, можно постепенно повышать интенсивность: силовые тренировки, ноги, ягодицы, корпус.':'Подойдут привычные нагрузки в комфортном темпе. Ориентируйся на восстановление и личные ощущения.';return `<div class="grid"><div class="card s6"><h2>🌸 Цикл и фаза</h2><p class="muted">Расчёт ориентировочный и не заменяет медицинскую рекомендацию.</p><div class="formline"><label class="tiny">Начало последнего цикла<input type="date" id="cycle" value="${esc(data.cycleStart||'')}"></label><label class="tiny">Длина цикла<input type="number" id="cyclelen" min="20" max="45" value="${len}"></label></div><button onclick="data.cycleStart=document.getElementById('cycle').value;data.cycleLen=+document.getElementById('cyclelen').value;save();render()">Сохранить цикл</button>${day?`<div class="phase-box"><div class="pill">${phase}</div><div class="stat">День ${day}</div><p>${advice}</p></div>`:`<p class="muted">${advice}</p>`}</div><div class="card s6"><h2>🏋️ Тренировка сегодня · ${fmt(today())}</h2><p class="tiny">Отметь несколько направлений и нажми «Сохранить тренировку» function lifePage(){return `<div class="grid"><div class="card s12"><h2>☼ Это всё моё</h2><p class="tiny">Добавляй сюда всё, что отражает твою жизнь, мечты и желания. Фотографии сохраняются целиком, без обрезки. Нажми на карточку, чтобы увидеть аффирмацию.</p><div class="formline"><input id="visiontitle" placeholder="Название мечты / цели"><input id="visionaff" placeholder="Аффирмация к фотографии"></div><label class="tiny">Фотография<input id="visionfile" type="file" accept="image/*"></label><button onclick="addVision()">Прикрепить на доску</button><div class="vision-board">${data.vision.map((v,i)=>`<div class="vision-pin" onclick="alert(${JSON.stringify(v.aff||'')})"><div class="photo">${v.url?`<img src="${esc(v.url)}" alt="${esc(v.title)}">`:'🌄'}</div><h3>${esc(v.title)}</h3><p>${esc(v.aff)}</p><button class="danger" onclick="event.stopPropagation();data.vision.splice(${i},1);save();render()">Убрать</button></div>`).join('')}</div></div><div class="card s12"><h2>💌 Аффирмации</h2><div class="formline"><input id="aff" placeholder="Я могу…"><button onclick="addAff()">＋</button></div>${data.affirmations.map((a,i)=>`<div class="item"><span class="txt">${esc(a)}</span><button class="danger" onclick="data.affirmations.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">Добавь фразы, которые поддерживают тебя.</p>'}</div><div class="card s12"><h2>🎁 Вишлист</h2><div class="formline"><input id="wish" placeholder="Название желания"><input id="wishfile" type="file" accept="image/*"><button onclick="addWish()">＋ Добавить</button></div><div class="listcards">${data.wishlist.map((w,i)=>`<div class="subcard"><div class="photo">${w.photo?`<img src="${w.photo}" alt="${esc(w.name)}">`:'🎁'}</div><b>${esc(w.name)}</b><div class="formline"><input type="number" value="${w.price||0}" placeholder="Цена" onchange="data.wishlist[${i}].price=+this.value;save()"><input type="number" value="${w.saved||0}" placeholder="Накоплено" onchange="data.wishlist[${i}].saved=+this.value;save()"></div><div class="progress"><b style="width:${w.price?Math.min(100,w.saved/w.price*100):0}%"></b></div><button class="danger" onclick="data.wishlist.splice(${i},1);save();render()">Удалить</button></div>`).join('')}</div></div></div>`}
function rewardsPage(){let month=today().slice(0,7),monthly=data.tasks.filter(t=>(t.date||'').startsWith(month)&&t.done).length;return `<div class="card"><h2>✨ Мои результаты</h2><div class="stat">${monthly}</div><p>Выполнено задач за месяц</p><p>Закрыто дней: ${data.closedDays.filter(d=>d.startsWith(month)).length}</p></div>`}
function settingsPage(){return `<div class="grid"><div class="card s6"><h2>💾 Резервная копия</h2><p class="muted">Сохрани все данные в файл или восстанови их из ранее созданной копии.</p><button onclick="exportData()">Экспортировать все данные</button><p><input type="file" accept="application/json" onchange="importData(event)"></p></div><div class="card s6"><h2>☁️ Автоматическая синхронизация</h2><p class="muted">Для синхронизации между компьютером и телефоном нужен личный облачный проект Firebase. Создай проект и вставь сюда его настройки. Данные будут храниться в приватном документе.</p><label class="tiny">Firebase config (JSON)<textarea id="fbconfig" placeholder='{"apiKey":"…","authDomain":"…","projectId":"…","appId":"…"}'>${esc(localStorage.getItem('lifeos_fbconfig')||'')}</textarea></label><div class="formline"><input id="fbemail" type="email" placeholder="Твоя почта для входа"><input id="fbpass" type="password" placeholder="Пароль (от 6 символов)"></div><div class="formline"><button onclick="connectFirebase(false)">Войти и синхронизировать</button><button class="soft" onclick="connectFirebase(true)">Создать аккаунт</button></div><p id="cloudstatus" class="tiny">${localStorage.getItem('lifeos_cloudstatus')||'Облако пока не подключено. Сейчас данные сохраняются на этом устройстве.'}</p></div><div class="card s12"><h2>Как это работает</h2><p>Изменения сохраняются автоматически в браузере. Экспортируй резервную копию время от времени. После подключения одного и того же Firebase-проекта на двух устройствах данные будут синхронизироваться через облако.</p><button class="danger" onclick="if(confirm('Удалить все данные из этого браузера? Сначала сделай экспорт.')){localStorage.removeItem('lifeos');data=structuredClone(defaults);save();render()}">Очистить данные на этом устройстве</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-life-os-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...structuredClone(defaults),...JSON.parse(r.result)};save();render();alert('Данные восстановлены!')}catch(err){alert('Не удалось прочитать файл.')}};r.readAsText(f)}
async function connectFirebase(createAccount){let status=document.getElementById('cloudstatus');try{let cfg=JSON.parse(document.getElementById('fbconfig').value);if(!cfg.apiKey||!cfg.projectId||!cfg.appId)throw Error('В конфигурации не хватает apiKey, projectId или appId.');localStorage.setItem('lifeos_fbconfig',JSON.stringify(cfg));status.textContent='Подключаемся…';await loadFirebase(cfg,createAccount);status.textContent='☁️ Облако подключено. Синхронизация активна.';localStorage.setItem('lifeos_cloudstatus',status.textContent)}catch(e){status.textContent='Не подключено: '+e.message+' · Локальное сохранение продолжает работать.'}}
let cloudDb=null,cloudUser=null,cloudTimer=null,cloudUnsub=null,applyingRemote=false;
async function loadFirebase(cfg,createAccount){if(!window.firebase){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
let app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);let auth=firebase.auth(app);let email=document.getElementById('fbemail').value.trim(),password=document.getElementById('fbpass').value;if(!email||password.length<6)throw Error('Введи почту и пароль минимум из 6 символов.');let credential=createAccount?await auth.createUserWithEmailAndPassword(email,password):await auth.signInWithEmailAndPassword(email,password);cloudUser=credential.user;cloudDb=firebase.firestore(app);let ref=cloudDb.collection('lifeosUsers').doc(cloudUser.uid);let snap=await ref.get();if(snap.exists){let remote=snap.data().payload;if(remote&&confirm('В облаке уже есть данные. Загрузить их на это устройство?')){data={...structuredClone(defaults),...remote};localStorage.setItem('lifeos',JSON.stringify(data));render()}}else await ref.set({payload:data,updatedAt:Date.now()});if(cloudUnsub)cloudUnsub();cloudUnsub=ref.onSnapshot(s=>{if(!s.exists)return;let remote=s.data().payload;if(remote){let remoteStamp=s.data().updatedAt||0;let localStamp=+(localStorage.getItem('lifeos_cloud_stamp')||0);if(remoteStamp>localStamp){applyingRemote=true;data={...structuredClone(defaults),...remote};localStorage.setItem('lifeos',JSON.stringify(data));localStorage.setItem('lifeos_cloud_stamp',String(remoteStamp));render();applyingRemote=false;let st=document.getElementById('cloudstatus');if(st)st.textContent='☁️ Синхронизировано · '+new Date(remoteStamp).toLocaleTimeString('ru-RU')}}},e=>{let st=document.getElementById('cloudstatus');if(st)st.textContent='Ошибка синхронизации: '+e.message});ref.set({payload:data,updatedAt:Date.now()},{merge:true});}
let originalSave=save;save=function(){originalSave();bark();if(cloudDb&&cloudUser&&!applyingRemote){cloudDb.collection('lifeosUsers').doc(cloudUser.uid).set({payload:data,updatedAt:Date.now()}).catch(e=>{let s=document.getElementById('cloudstatus');if(s)s.textContent='Ошибка облачной записи: '+e.message})}}
document.addEventListener('input',e=>{if(e.target&&e.target.id==='workspaceTitle')saveWorkspaceEditor()});
window.addEventListener('resize',()=>renderHeader());
document.addEventListener('input',e=>{if(e.target&&e.target.id==='workspaceTitle')saveWorkspaceEditor()});
window.addEventListener('resize',()=>renderHeader());
render();nav();
