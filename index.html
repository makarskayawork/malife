/* Life OS — GitHub Pages edition */
:root{--bg:#E3E7DE;--card:#fff;--sand:#E2D5BB;--olive:#b9b560;--terra:#aa6d51;--ink:#263323;--muted:#818779;--line:#e9ece5;--shadow:0 12px 34px #39433312}
body{background:radial-gradient(ellipse at 12% 0%,#f7f7f1 0,transparent 34%),var(--bg);letter-spacing:-.015em}
.app{max-width:1440px;padding:24px 30px 38px}
.top{align-items:flex-start;gap:24px;margin-bottom:22px}
.brand{font-size:25px;letter-spacing:-.06em;color:var(--ink);white-space:nowrap}
.brand span{color:var(--terra)}
.nav{gap:6px;justify-content:flex-end}
.nav button{border-radius:30px;background:#ffffffb8;color:#53604e;padding:10px 14px;font-size:12px;transition:.2s}
.nav button.active{background:var(--ink);color:#fff;box-shadow:0 5px 15px #26332325}
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#e8d4c5 0%,#e6dfc9 47%,#c9cba9 100%);border:1px solid #ffffffa6;min-height:190px;padding:30px 34px;border-radius:30px;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff55;border-radius:50%;right:12%;top:-160px;box-shadow:0 0 0 24px #ffffff15,0 0 0 50px #ffffff10}
.hero h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.06em;color:#263323;margin:8px 0}
.hero>div:first-child{position:relative;z-index:1}
.dogbox{position:relative;z-index:1;min-width:min(46%,430px);gap:16px}
.track{height:94px;border-bottom:2px dashed #fff9;min-width:210px}
.dog{position:absolute;left:0;bottom:-3px;width:82px;height:78px;transition:left .65s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 5px 3px #26332320);overflow:visible}
.dog.running{animation:dogRun .42s ease-in-out 3}
@keyframes dogRun{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-9px) rotate(-4deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-5px) rotate(-2deg)}}
.ball{position:absolute;right:0;bottom:0;font-size:25px;filter:drop-shadow(0 3px 2px #3332)}
.dogscore{min-width:76px}
.card{border:1px solid #fff;box-shadow:var(--shadow);border-radius:24px;padding:22px;transition:transform .18s,box-shadow .18s}
.card h2{font-size:18px;letter-spacing:-.04em;color:var(--ink)}
button{background:var(--sand);border-radius:14px;transition:transform .15s,filter .15s}
button:active{transform:scale(.97)}
button.soft,.nav button{background:#f2f4ee}
button.danger{background:#f4e7df;color:#925d48}
input,textarea,select{border-color:#e8ebe3;border-radius:13px}
input:focus,textarea:focus,select:focus{border-color:var(--olive);box-shadow:0 0 0 3px #b9b56020}
.pill{background:#f1f0e4;color:#62634b}
.progress b{background:linear-gradient(90deg,var(--terra),var(--olive))}
.item{gap:11px}
.item button{padding:7px 10px}
.subcard{background:#f7f8f4;border:1px solid #edf0e9;border-radius:18px}
.english-text{background:#f7f8f4;border:1px solid #edf0e9}
.footer{padding-bottom:18px}
@media(min-width:761px){
 .app{display:grid;grid-template-columns:220px minmax(0,1fr);column-gap:24px}
 .top{grid-column:1;grid-row:1 / span 3;position:sticky;top:18px;display:flex;flex-direction:column;align-items:stretch;height:calc(100vh - 36px);padding:18px 12px;background:#ffffffa6;border:1px solid #fff;border-radius:26px;box-shadow:var(--shadow)}
 .top .nav{display:flex;flex-direction:column;align-items:stretch;margin-top:20px}
 .top .nav button{text-align:left;padding:13px 15px}
 .hero{grid-column:2;grid-row:1}
 #main{grid-column:2;grid-row:2}
 .footer{grid-column:2;grid-row:3}
 .tabs{display:none!important}
}
@media(max-width:760px){
 .app{padding:12px 12px 96px}
 .top{display:block;padding:5px 3px}
 .brand{font-size:22px}
 .top .nav{display:none}
 .hero{padding:22px 20px;min-height:0}
 .hero h1{font-size:30px}
 .dogbox{min-width:0;margin-top:18px}
 .track{height:84px}
 .dog{width:76px;height:73px}
 .card{padding:17px;border-radius:21px}
 .tabs{background:#fffdf8f2;backdrop-filter:blur(18px);border-top:1px solid #e7e9e2;box-shadow:0 -8px 24px #39433312;padding:8px 5px calc(8px + env(safe-area-inset-bottom));}
 .tabs button{border-radius:13px;min-width:58px;font-size:10px;color:#56604f}
 .tabs button.active{background:var(--ink);color:white}
 .footer{padding-bottom:10px}
}

/* Палитра: терракота, оливковый, бежевый и шампань — только ровные заливки */
:root{--bg:#F3E3C8;--card:#FFF9EF;--sand:#E8D2B8;--olive:#b9b560;--terra:#aa6d51;--ink:#30251F;--muted:#66594F;--line:#D8C3AA;--shadow:0 8px 24px #5B3B291c}
html,body{background:#F3E3C8!important;color:#30251F}
body{background:#F3E3C8!important}
.hero{background:#aa6d51!important;color:#fff;border:3px solid #b9b560;box-shadow:0 9px 0 #b9b560}
.hero h1,.hero .muted{color:#fff!important}
.card{background:#FFF9EF;border:2px solid #b9b560;box-shadow:var(--shadow)}
.card:nth-child(even){background:#F3E3C8;border-color:#aa6d51}
.subcard{background:#E8D2B8!important;border:1px solid #aa6d51!important;color:#30251F}
button{background:#aa6d51!important;color:#fff!important;border:1px solid #8e573f}
button.soft,.nav button{background:#b9b560!important;color:#30251F!important;border-color:#929346}
button.danger{background:#E8D2B8!important;color:#653c2d!important;border-color:#aa6d51}
.nav button.active,.tabs button.active{background:#30251F!important;color:#fff!important}
input,textarea,select{background:#fffdf8!important;color:#30251F!important;border:2px solid #b9b560!important}
input:focus,textarea:focus,select:focus{outline:3px solid #aa6d51!important;box-shadow:none!important}
.pill{background:#b9b560!important;color:#30251F!important;font-weight:800}
.progress{background:#E8D2B8}
.progress b{background:#aa6d51!important}
.item{border-color:#D8C3AA}
.english-text{background:#E8D2B8!important;border:2px solid #b9b560!important}
.word{background:#b9b560}
.photo{height:auto;min-height:120px;background:#E8D2B8;border:1px solid #aa6d51;padding:8px}
.photo img{width:100%;height:auto;max-height:320px;object-fit:contain}
.dogbox{min-width:min(46%,430px)}
.dog-photo{width:112px;height:112px;object-fit:contain;position:absolute;left:0;bottom:-5px;filter:drop-shadow(0 5px 3px #30251f35);background:transparent}
.track{height:120px;border-bottom:3px dashed #fff}
.ball{display:none}
.dog.running{animation:dogRun .42s ease-in-out 2}
.habit-chart{display:flex;align-items:center;gap:22px;margin:14px 0 20px}
.habit-column{height:150px;width:48px;border-radius:12px;background:#E8D2B8;border:2px solid #aa6d51;display:flex;align-items:flex-end;overflow:hidden}
.habit-fill{width:100%;background:#b9b560;border-radius:8px 8px 0 0}
.content-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin:12px 0}
.calendar-day{min-height:68px;padding:6px;background:#E8D2B8;border:1px solid #aa6d51;border-radius:9px;overflow:hidden}
.calendar-day.has-content{background:#b9b560}
.calendar-event{display:block;width:100%;white-space:normal;text-align:left;font-size:9px;padding:4px;margin-top:4px;border-radius:5px}
.workout-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.workout-options label{background:#E8D2B8;border:1px solid #aa6d51;padding:11px;border-radius:12px;font-weight:700}
.workout-options input{width:auto}
.phase-box{background:#b9b560;padding:15px;border-radius:16px;margin-top:15px;color:#30251F}
.stats-chips{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}
.vision-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-top:18px;padding:18px;background:#E8D2B8;border:4px solid #aa6d51;border-radius:14px;box-shadow:inset 0 0 0 5px #b9b560}
.vision-pin{background:#FFF9EF;padding:12px;border:2px solid #b9b560;border-radius:12px;cursor:pointer;box-shadow:0 4px 0 #aa6d51}
.vision-pin .photo{height:auto;min-height:110px}
.vision-pin .photo img{object-fit:contain;max-height:260px}
.flashcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:12px 0}
.flashcard{min-height:125px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#b9b560!important;color:#30251F!important;border:2px solid #aa6d51}
.flashcard.revealed{background:#E8D2B8!important}
.flashcard small{font-size:11px}
.reward-tier{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px;margin:8px 0;border-radius:12px;background:#E8D2B8;border:1px solid #aa6d51;font-weight:800}
.reward-tier small{display:block;font-size:11px;font-weight:500}
.reward-tier button:disabled{opacity:.5;cursor:not-allowed}
.footer{color:#66594F}
@media(max-width:760px){.app{padding-bottom:100px}.dogbox{min-width:0}.dog-photo{width:90px;height:90px}.track{height:100px}.content-calendar{gap:3px}.calendar-day{min-height:55px;padding:3px;font-size:10px}.calendar-event{font-size:8px;padding:2px}.workout-options{grid-template-columns:1fr 1fr}.vision-board{padding:9px}.reward-tier{align-items:flex-start}.reward-tier button{padding:7px;font-size:11px}}
</style>

<main id="main"></main><div class="footer">Твои планы, идеи и маленькие победы — в одном месте ♡</div></div><nav class="tabs" id="bottomnav"></nav>
<script>
const sections=[['home','Главная','⌂'],['tasks','Неделя','▦'],['habits','Привычки','✓'],['work','Работа','✦'],['english','English','A'],['health','Здоровье','♡'],['life','Моя жизнь','☼'],['rewards','Награды','★']];
const defaults={tasks:[],workDocs:[],content:[],workouts:[],habits:[{name:'Спорт · 1 час в день',log:{}},{name:'Mind saturation session · 1 час',log:{}},{name:'Просыпаться в 7:00',log:{}}],projects:[],dictionary:[],ideas:[],posts:[],wishlist:[],vision:[],affirmations:[],rewards:[],spent:[],journal:{},energy:{},englishLevel:0,focusTotal:0,focusSessions:[],points:0,closedDays:[],health:{},notes:{}};
let data=load(),page='home',timer=null,remaining=0,focusStarted=null;
function load(){try{let d={...structuredClone(defaults),...JSON.parse(localStorage.getItem('lifeos')||'{}')};['workDocs','content','workouts'].forEach(k=>d[k]??=[]);return d}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem('lifeos',JSON.stringify(data));renderHeader()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Date.now()+Math.random().toString(16).slice(2)}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function nav(){let h=sections.map(([k,n,ic])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${ic} ${n}</button>`).join('');document.getElementById('topnav').innerHTML=h;document.getElementById('bottomnav').innerHTML=h}
function go(p){page=p;nav();render()}
let lastDogStage=-1;
function renderHeader(){document.getElementById('today').textContent=fmt(today());let hr=new Date().getHours();document.getElementById('greeting').textContent=(hr<12?'Доброе утро':hr<18?'Хорошего дня':'Добрый вечер')+'!';document.getElementById('points').textContent=data.points||0;let total=data.tasks.filter(t=>t.date===today()).length,done=data.tasks.filter(t=>t.date===today()&&t.done).length;let pct=total?done/total:0;let stage=total?Math.floor(pct*4):0;let dog=document.getElementById('dog');dog.style.left=(pct*78)+'%';document.getElementById('dogstage').textContent=total?(done===total?'финиш! 🏆':`этап ${Math.min(4,stage+1)} из 4`):'ждёт первую задачу';if(lastDogStage!==-1&&stage!==lastDogStage){dog.classList.remove('running');void dog.getBoundingClientRect();dog.classList.add('running')}lastDogStage=stage}
function addTask(){let text=document.getElementById('newtask').value.trim();if(!text)return;let t={id:id(),text,date:document.getElementById('taskdate').value||today(),slot:document.getElementById('taskslot').value,category:document.getElementById('taskcategory').value,done:false};routeWorkTask(t);data.tasks.push(t);save();render()}
function toggleTask(i){let t=data.tasks[i];t.done=!t.done;data.points=Math.max(0,(data.points||0)+(t.done?1:-1));save();render()}
function delTask(i){data.tasks.splice(i,1);save();render()}
function editTask(i){let t=data.tasks[i],v=prompt('Изменить задачу',t.text);if(v!==null){t.text=v;save();render()}}
function addHabit(){let v=document.getElementById('habitnew').value.trim();if(v){data.habits.push({name:v,log:{}});save();render()}}
function habitToggle(i){let h=data.habits[i],d=today();h.log[d]=!h.log[d];save();render()}
function habitStreak(h){let n=0,d=new Date();while(h.log[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}
function closeDay(){if(!data.closedDays.includes(today())){data.closedDays.push(today());data.points+=5;save();alert('День закрыт! +5 баллов ✨')}else alert('Этот день уже закрыт.')}
function addProject(){let n=prompt('Название нового проекта');if(n&&n.trim()){data.projects.push({id:id(),name:n.trim(),folders:['Основные материалы','Юридическая часть','Сторителлинги','Продуктовая линейка','Ценовая декомпозиция','Прогрев','Как улучшить','Другое'].map(name=>({name,notes:''}))});save();render()}}
function projectEdit(i){let n=prompt('Название проекта',data.projects[i].name);if(n){data.projects[i].name=n;save();render()}}
function folderEdit(pi,fi){let f=data.projects[pi].folders[fi],v=prompt(f.name+' — материалы и заметки',f.notes);if(v!==null){f.notes=v;save();render()}}
function addWord(){let w=document.getElementById('word').value.trim(),tr=document.getElementById('translation').value.trim();if(w&&tr){data.dictionary.push({w,tr,emoji:document.getElementById('emoji').value||'💡'});save();render()}}
function addIdea(){let v=document.getElementById('idea').value.trim();if(v){data.ideas.push(v);save();render()}}
function addWish(){let v=document.getElementById('wish').value.trim(),file=document.getElementById('wishfile').files[0];if(!v)return;let add=photo=>{data.wishlist.push({id:id(),name:v,price:0,saved:0,photo});save();render()};if(file){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(file)}else add('')}
function addReward(){let n=document.getElementById('rewardname').value.trim(),p=+document.getElementById('rewardprice').value;if(n&&p>0){data.rewards.push({name:n,price:p});save();render()}}
function redeem(i){let r=data.rewards[i];if(data.points>=r.price&&confirm('Обменять '+r.price+' баллов на «'+r.name+'»?')){data.points-=r.price;data.spent.push({name:r.name,date:today()});save();render()}else if(data.points<r.price)alert('Пока не хватает баллов 💛')}
function addVision(){let title=document.getElementById('visiontitle').value.trim(),aff=document.getElementById('visionaff').value.trim(),file=document.getElementById('visionfile').files[0];if(!title)return;let add=url=>{data.vision.push({title,aff,url});save();render()};if(file){let r=new FileReader();r.onload=()=>add(r.result);r.readAsDataURL(file)}else add('')}
function addAff(){let v=document.getElementById('aff').value.trim();if(v){data.affirmations.push(v);save();render()}}
function addPost(){let platform=document.getElementById('platform').value,title=document.getElementById('posttitle').value.trim(),date=document.getElementById('postdate').value,script=document.getElementById('postscript').value.trim();if(title){data.content.push({id:id(),platform,title,date,script});save();render()}}
function addFocus(){let mins=+document.getElementById('focusmins').value||25;if(timer)clearInterval(timer);remaining=mins*60;focusStarted=Date.now();document.getElementById('timerdisplay').textContent=clock(remaining);timer=setInterval(()=>{remaining--;document.getElementById('timerdisplay').textContent=clock(remaining);if(remaining<=0){clearInterval(timer);timer=null;finishFocus('Фокус',mins);alert('Фокус-сессия завершена! Отличная работа.')}},1000);document.getElementById('timerstatus').textContent='Время для себя и важного дела'}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stopFocus(){if(timer){clearInterval(timer);timer=null;let elapsed=Math.max(1,Math.round((Date.now()-focusStarted)/60000));finishFocus('Фокус',elapsed);document.getElementById('timerstatus').textContent='Сессия остановлена'}}
function finishFocus(task,mins){data.focusTotal+=mins;data.focusSessions.push({date:today(),task,mins});save()}

function bark(){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;let c=new C(),o=c.createOscillator(),g=c.createGain();o.type='sawtooth';o.frequency.setValueAtTime(420,c.currentTime);o.frequency.exponentialRampToValueAtTime(150,c.currentTime+.16);g.gain.setValueAtTime(.0001,c.currentTime);g.gain.exponentialRampToValueAtTime(.12,c.currentTime+.025);g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.2);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.21);setTimeout(()=>c.close(),350)}catch(e){}}
function routeWorkTask(t){if(t.category!=='Работа')return;let p=data.projects.find(x=>x.name==='Работа');if(!p){p={id:id(),name:'Работа',folders:[]};data.projects.push(p)}let d={id:id(),projectId:p.id,title:t.text,body:'Задача из планировщика: '+t.text};data.workDocs.push(d);t.docId=d.id}
function newWorkDoc(i){let p=data.projects[i],title=prompt('Название документа');if(!title)return;let d={id:id(),projectId:p.id,title,body:''};data.workDocs.push(d);save();editWorkDoc(d.id)}
function editWorkDoc(docId){let d=data.workDocs.find(x=>x.id===docId);if(!d)return;let title=prompt('Название документа',d.title);if(title===null)return;let body=prompt('Содержание документа — можно дополнять и редактировать',d.body||'');if(body===null)return;d.title=title;d.body=body;save();render()}
function viewContent(contentId){let x=data.content.find(c=>c.id===contentId);if(x)alert(x.date+' · '+x.platform+' · '+x.title+'\\n\\n'+(x.script||'Сценарий пока не добавлен.'))}
function toggleWorkout(type){let h=data.health[today()]??={training:[],symptoms:''};h.training??=[];let ix=h.training.indexOf(type);if(ix>=0)h.training.splice(ix,1);else h.training.push(type);data.workouts=data.workouts.filter(x=>x.date!==today());if(h.training.length)data.workouts.push({date:today(),types:[...h.training]});save();render()}
function speakEnglish(text){let u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.88;let voices=speechSynthesis.getVoices();let v=voices.find(x=>/^en-US/i.test(x.lang))||voices.find(x=>/^en/i.test(x.lang));if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}
function addFlashcard(){let w=document.getElementById('flashword').value.trim(),tr=document.getElementById('flashtranslation').value.trim();if(w&&tr){data.flashcards??=[];data.flashcards.push({w,tr});save();render()}}
function claimTier(name,price){if(data.points<price)return; if(confirm('Получить награду «'+name+'» за '+price+' баллов?')){data.points-=price;data.spent.push({name,date:today()});save();render()}}

}

lick="addPost()">Сохранить в календарь</button><h3 style="margin-top:22px">🗓 Календарь контента · ${new Date().toLocaleDateString('ru-RU',{month:'long',year:'numeric'})}</h3><div class="content-calendar">${Array.from({length:new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()},(_,i)=>{let day=month+'-'+String(i+1).padStart(2,'0'),items=data.content.filter(x=>x.date===day);return `<div class="calendar-day ${items.length?'has-content':''}"><b>${i+1}</b>${items.map(x=>`<button class="calendar-event" onclick="viewContent('${x.id}')">${esc(x.platform)} · ${esc(x.title)}</button>`).join('')}</div>`}).join('')}</div><h3>Все публикации</h3>${events.map(x=>`<div class="item"><span class="txt"><b>${esc(x.date)}</b> · ${esc(x.platform)} · ${esc(x.title)}</span><button class="soft" onclick="viewContent('${x.id}')">Открыть</button><button class="danger" onclick="data.content=data.content.filter(c=>c.id!=='${x.id}');save();render()">×</button></div>`).join('')}</div></div>`}

function englishPage(){let ix=Math.min(lessons.length-1,data.englishLevel||0),l=lessons[ix],cards=data.flashcards||[{w:'consistency',tr:'последовательность'},{w:'meaningful',tr:'значимый'},{w:'perspective',tr:'точка зрения'}];return `<div class="grid"><div class="card s8"><div class="bar"><h2>🇬🇧 Английский · ${l.level}</h2><span class="pill">30 минут в день</span></div><h3>${l.title}</h3><div class="english-text">${l.text.split(' ').map(w=>`<span>${esc(w)} </span>`).join('')}</div><p><b>Вопрос:</b> ${l.q}</p><input id="answer" placeholder="Write your answer in English"><div class="formline"><button onclick="let a=document.getElementById('answer').value.toLowerCase();alert(a.includes('${l.a}')?'Отлично! Правильно 🎉':'Попробуй ещё раз. Подсказка: ответ есть в тексте.')">Проверить ответ</button><button class="soft" onclick="data.englishLevel=Math.min(3,(data.englishLevel||0)+1);save();render()">Следующий уровень →</button></div><button class="soft" onclick="speakEnglish(${JSON.stringify(l.text)})">🔊 Прослушать текст</button><h3 style="margin-top:22px">Карточки для запоминания</h3><div class="flashcards">${cards.map((c,i)=>`<button class="flashcard" onclick="this.classList.toggle('revealed');this.querySelector('.answer-side').textContent=this.classList.contains('revealed')?'${esc(c.tr)}':'Нажми, чтобы увидеть перевод'"><b>${esc(c.w)}</b><span class="answer-side">Нажми, чтобы увидеть перевод</span><small>🔊 <span onclick="event.stopPropagation();speakEnglish('${esc(c.w)}')">Произношение</span></small></button>`).join('')}</div><div class="formline"><input id="flashword" placeholder="Новое слово"><input id="flashtranslation" placeholder="Перевод"><button onclick="addFlashcard()">Добавить</button></div></div><div class="card s4"><h2>📚 Мой словарь</h2><div class="formline"><input id="word" placeholder="Word"><input id="translation" placeholder="Перевод"></div><div class="formline"><input id="emoji" placeholder="Эмодзи" value="💡"><button onclick="addWord()">Добавить</button>< function healthPage(){let h=data.health[today()]||{training:[],symptoms:''};h.training??=[];let len=data.cycleLen||28,start=data.cycleStart,day=start?((Math.floor((new Date(today())-new Date(start+'T00:00:00'))/86400000)%len)+len)%len+1:null,phase=day?(day<=5?'Менструальная фаза':day<=(len/2-2)?'Фолликулярная фаза':day<=(len/2+2)?'Овуляторное окно':'Лютеиновая фаза'):null,choices=['Талия / живот','Попа','Ноги','Растяжка','Спина / грудь','Вумен момент'],month=new Date().toISOString().slice(0,7),done=data.workouts.filter(x=>x.date.startsWith(month));let advice=!phase?'Укажи начало последнего цикла — появятся ориентировочные рекомендации.':phase==='Менструальная фаза'?'Мягкая активность по самочувствию: прогулка, лёгкая растяжка. Не перегружайся, если есть боль или слабость.':phase==='Фолликулярная фаза'?'Если самочувствие хорошее, можно постепенно повышать интенсивность: силовые тренировки, ноги, ягодицы, корпус.':phase==='Овуляторное окно'?'При хорошем самочувствии подойдут привычные силовые и функциональные тренировки. Следи за техникой и восстановлением.':'Выбирай умеренную нагрузку, пилатес, растяжку или силовую в комфортном темпе; ориентируйся на энергию и симптомы.';return `<div class="grid"><div class="card s6"><h2>🌸 Цикл и фаза</h2><p class="muted">Расчёт ориентировочный и не заменяет медицинскую рекомендацию.</p><div class="formline"><label class="tiny">Начало последнего цикла<input type="date" id="cycle" value="${esc(data.cycleStart||'')}"></label><label class="tiny">Длина цикла<input type="number" id="cyclelen" min="20" max="45" value="${len}"></label></div><button onclick="data.cycleStart=document.getElementById('cycle').value;data.cycleLen=+document.getElementById('cyclelen').value;save();render()">Сохранить цикл</button>${day?`<div class="phase-box"><div class="pill">${phase}</div><div class="stat">День ${day}</div><p>${advice}</p></div>`:`<p class="muted">${advice}</p>`}</div><div class="card s6"><h2>🏋️ Выбери тренировку</h2><p class="tiny">Можно отметить несколько направлений за день.</p><div class="workout-options">${choices.map(c=>`<label><input type="checkbox" ${h.training.includes(c)?'checked':''} onchange="toggleWorkout('${c}')"> ${c}</label>`).join('')}</div><textarea onchange="healthSet('symptoms',this.value)" placeholder="Самочувствие, энергия, заметки…">${esc(h.symptoms||'')}</textarea><p class="tiny">Подсказка по фазе: ${advice}</p></div><div class="card s12"><h2>📊 Статистика тренировок за месяц</h2><div class="stats-chips">${choices.map(c=>`<span class="pill">${c}: ${done.filter(x=>x.types.includes(c)).length}</span>`).join('')}</div><div class="listcards">${done.map(x=>`<div class="subcard"><b>${esc(x.date)}</b><p>${x.types.map(esc).join(' · ')}</p></div>`).join('')||'<p class="muted">В этом месяце тренировок пока нет.</p>'}</div></div></div>`}
function healthSet(k,v){data.health[today()]??={water:0,food:'',training:'',symptoms:''};data.health[today()][k]=v;save()}
function cycleInfo(){if(!data.cycleStart)return '<p class="muted">Дата начала пока не указана.</p>';let days=Math.floor((new Date(today())-new Date(data.cycleStart+'T00:00:00'))/86400000),len=data.cycleLen||28,day=days%len+1,phase=day<=5?'Менструальная фаза':day<=(len/2-2)?'Фолликулярная фаза':day<=(len/2+2)?'Овуляторное окно':'Лютеиновая фаза';return `<p>Примерный день цикла: <b>${day}</b> · ${phase}</p><p class="tiny">Это календарная оценка, не медицинский прогноз. Индивидуальные циклы могут отличаться.</p>`}
function lifePage(){return `<div class="grid"><div class="card s12"><h2>☼ Моя пробковая доска желаний</h2><p class="tiny">Добавляй фотографии — они сохраняются целиком, без обрезки. Нажми на карточку, чтобы увидеть аффирмацию.</p><div class="formline"><input id="visiontitle" placeholder="Название мечты / цели"><input id="visionaff" placeholder="Аффирмация к фотографии"></div><label class="tiny">Фотография<input id="visionfile" type="file" accept="image/*"></label><button onclick="addVision()">Прикрепить на доску</button><div class="vision-board">${data.vision.map((v,i)=>`<div class="vision-pin" onclick="alert(${JSON.stringify(v.aff||'')})"><div class="photo">${v.url?`<img src="${esc(v.url)}" alt="${esc(v.title)}">`:'🌄'}</div><h3>${esc(v.title)}</h3><p>${esc(v.aff)}</p><button class="danger" onclick="event.stopPropagation();data.vision.splice(${i},1);save();render()">Убрать</button></div>`).join('')}</div></div><div class="card s12"><h2>💌 Аффирмации</h2><div class="formline"><input id="aff" placeholder="Я могу…"><button onclick="addAff()">＋</button></div>${data.affirmations.map((a,i)=>`<div class="item"><span class="txt">${esc(a)}</span><button class="danger" onclick="data.affirmations.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">Добавь фразы, которые поддерживают тебя.</p>'}</div><div class="card s12"><h2>🎁 Вишлист</h2><div class="formline"><input id="wish" placeholder="Название желания"><input id="wishfile" type="file" accept="image/*"><button onclick="addWish()">＋ Добавить</button></div><div class="listcards">${data.wishlist.map((w,i)=>`<div class="subcard"><div class="photo">${w.photo?`<img src="${w.photo}" alt="${esc(w.name)}">`:'🎁'}</div><b>${esc(w.name)}</b><div class="formline"><input type="number" value="${w.price||0}" placeholder="Цена" onchange="data.wishlist[${i}].price=+this.value;save()"><input type="number" value="${w.saved||0}" placeholder="Накоплено" onchange="data.wishlist[${i}].saved=+this.value;save()"></div><div class="progress"><b style="width:${w.price?Math.min(100,w.saved/w.price*100):0}%"></b></div><button class="danger" onclick="data.wishlist.splice(${i},1);save();render()">Удалить</button></div>`).join('')}</div></div></div>`}
function rewardsPage(){let month=new Date().toISOString().slice(0,7),monthly=data.tasks.filter(t=>t.date.startsWith(month)&&t.done).length,tiers=[{name:'Мороженое 🍦',price:5},{name:'Кофе / любимый напиток ☕',price:15},{name:'Маленький подарок 🎀',price:40},{name:'День заботы о себе 💆',price:100},{name:'Большая мечта ✨',price:500},{name:'Идеальная фигура / большая цель 🏆',price:1000},{name:'1 000 000 рублей 💰',price:5000}];return `<div class="grid"><div class="card s6"><h2>🏆 Магазин наград</h2><p>Баланс: <b class="stat">${data.points} баллов</b></p><p class="tiny">+1 балл за каждую выполненную задачу, +5 за закрытый день.</p><div class="formline"><input id="rewardname" placeholder="Своя награда"><input id="rewardprice" type="number" min="1" placeholder="Цена в баллах"><button onclick="addReward()">＋</button></div>${tiers.map(r=>`<div class="reward-tier"><span>${r.name}<small> · ${r.price} баллов</small></span><button ${data.points<r.price?'disabled':''} onclick="claimTier('${r.name}',${r.price})">${data.points>=r.price?'Получить':'Ещё '+(r.price-data.points)}</button></div>`).join('')}${data.rewards.map((r,i)=>`<div class="item"><span class="txt">🎁 ${esc(r.name)} · ${r.price} баллов</span><button onclick="redeem(${i})">Получить</button><button class="danger" onclick="data.rewards.splice(${i},1);save();render()">×</button></div>`).join('')}</div><div class="card s6"><h2>📈 Статистика за месяц</h2><div class="stat">${monthly}</div><p class="tiny">Выполненных задач в этом месяце</p><div class="progress"><b style="width:${Math.min(100,monthly/100*100)}%"></b></div><p>Закрытых дней: <b>${data.closedDays.filter(d=>d.startsWith(month)).length}</b></p><h3>История наград</h3>${data.spent.map(x=>`<div class="item"><span class="txt">${esc(x.name)}</span><span class="tiny">${esc(x.date)}</span></div>`).join('')||'<p class="muted">Твои награды будут появляться здесь.</p>'}</div></div>`}
function settingsPage(){return `<div class="grid"><div class="card s6"><h2>💾 Резервная копия</h2><p class="muted">Сохрани все данные в файл или восстанови их из ранее созданной копии.</p><button onclick="exportData()">Экспортировать все данные</button><p><input type="file" accept="application/json" onchange="importData(event)"></p></div><div class="card s6"><h2>☁️ Автоматическая синхронизация</h2><p class="muted">Для синхронизации между компьютером и телефоном нужен личный облачный проект Firebase. Создай проект и вставь сюда его настройки. Данные будут храниться в приватном документе.</p><label class="tiny">Firebase config (JSON)<textarea id="fbconfig" placeholder='{"apiKey":"…","authDomain":"…","projectId":"…","appId":"…"}'>${esc(localStorage.getItem('lifeos_fbconfig')||'')}</textarea></label><div class="formline"><input id="fbemail" type="email" placeholder="Твоя почта для входа"><input id="fbpass" type="password" placeholder="Пароль (от 6 символов)"></div><div class="formline"><button onclick="connectFirebase(false)">Войти и синхронизировать</button><button class="soft" onclick="connectFirebase(true)">Создать аккаунт</button></div><p id="cloudstatus" class="tiny">${localStorage.getItem('lifeos_cloudstatus')||'Облако пока не подключено. Сейчас данные сохраняются на этом устройстве.'}</p></div><div class="card s12"><h2>Как это работает</h2><p>Изменения сохраняются автоматически в браузере. Экспортируй резервную копию время от времени. После подключения одного и того же Firebase-проекта на двух устройствах данные будут синхронизироваться через облако.</p><button class="danger" onclick="if(confirm('Удалить все данные из этого браузера? Сначала сделай экспорт.')){localStorage.removeItem('lifeos');data=structuredClone(defaults);save();render()}">Очистить данные на этом устройстве</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-life-os-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...structuredClone(defaults),...JSON.parse(r.result)};save();render();alert('Данные восстановлены!')}catch(err){alert('Не удалось прочитать файл.')}};r.readAsText(f)}
async function connectFirebase(createAccount){let status=document.getElementById('cloudstatus');try{let cfg=JSON.parse(document.getElementById('fbconfig').value);if(!cfg.apiKey||!cfg.projectId||!cfg.appId)throw Error('В конфигурации не хватает apiKey, projectId или appId.');localStorage.setItem('lifeos_fbconfig',JSON.stringify(cfg));status.textContent='Подключаемся…';await loadFirebase(cfg,createAccount);status.textContent='☁️ Облако подключено. Синхронизация активна.';localStorage.setItem('lifeos_cloudstatus',status.textContent)}catch(e){status.textContent='Не подключено: '+e.message+' · Локальное сохранение продолжает работать.'}}
let cloudDb=null,cloudUser=null,cloudTimer=null,cloudUnsub=null,applyingRemote=false;
async function loadFirebase(cfg,createAccount){if(!window.firebase){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
let app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);let auth=firebase.auth(app);let email=document.getElementById('fbemail').value.trim(),password=document.getElementById('fbpass').value;if(!email||password.length<6)throw Error('Введи почту и пароль минимум из 6 символов.');let credential=createAccount?await auth.createUserWithEmailAndPassword(email,password):await auth.signInWithEmailAndPassword(email,password);cloudUser=credential.user;cloudDb=firebase.firestore(app);let ref=cloudDb.collection('lifeosUsers').doc(cloudUser.uid);let snap=await ref.get();if(snap.exists){let remote=snap.data().payload;if(remote&&confirm('В облаке уже есть данные. Загрузить их на это устройство?')){data={...structuredClone(defaults),...remote};localStorage.setItem('lifeos',JSON.stringify(data));render()}}else await ref.set({payload:data,updatedAt:Date.now()});if(cloudUnsub)cloudUnsub();cloudUnsub=ref.onSnapshot(s=>{if(!s.exists)return;let remote=s.data().payload;if(remote){let remoteStamp=s.data().updatedAt||0;let localStamp=+(localStorage.getItem('lifeos_cloud_stamp')||0);if(remoteStamp>localStamp){applyingRemote=true;data={...structuredClone(defaults),...remote};localStorage.setItem('lifeos',JSON.stringify(data));localStorage.setItem('lifeos_cloud_stamp',String(remoteStamp));render();applyingRemote=false;let st=document.getElementById('cloudstatus');if(st)st.textContent='☁️ Синхронизировано · '+new Date(remoteStamp).toLocaleTimeString('ru-RU')}}},e=>{let st=document.getElementById('cloudstatus');if(st)st.textContent='Ошибка синхронизации: '+e.message});ref.set({payload:data,updatedAt:Date.now()},{merge:true});}
let originalSave=save;save=function(){originalSave();bark();if(cloudDb&&cloudUser&&!applyingRemote){cloudDb.collection('lifeosUsers').doc(cloudUser.uid).set({payload:data,updatedAt:Date.now()}).catch(e=>{let s=document.getElementById('cloudstatus');if(s)s.textContent='Ошибка облачной записи: '+e.message})}}
render();nav();
</script></body></html>
