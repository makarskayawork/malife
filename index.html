<style>
@import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');
:root{--bg:#E3E7DE;--card:#fff;--sand:#E2D5BB;--olive:#b9b560;--terra:#aa6d51;--ink:#343a31;--muted:#788071;--line:#edf0e9;--shadow:0 10px 30px #45503b12}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,Arial,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:13px;padding:10px 14px;background:var(--sand);color:#3e4036;font-weight:700}button:hover{filter:brightness(.97)}input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);outline-color:var(--olive)}textarea{min-height:90px;resize:vertical}.app{max-width:1280px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{font-size:22px;font-weight:800}.brand span{color:var(--terra)}.nav{display:flex;gap:7px;flex-wrap:wrap}.nav button{background:#ffffff9c;padding:9px 12px}.nav button.active{background:var(--ink);color:white}.hero{background:linear-gradient(115deg,#d8bba8,#c7c58d);border-radius:28px;padding:26px;margin-bottom:18px;display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:145px}.hero h1{font-size:clamp(24px,4vw,36px);margin:5px 0}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:15px}.card{background:var(--card);border-radius:22px;padding:19px;box-shadow:var(--shadow);min-width:0}.card h2,.card h3{margin:0 0 12px}.s12{grid-column:span 12}.s8{grid-column:span 8}.s7{grid-column:span 7}.s6{grid-column:span 6}.s5{grid-column:span 5}.s4{grid-column:span 4}.s3{grid-column:span 3}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.stack{display:grid;gap:9px}.item{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item input[type=checkbox]{width:18px;height:18px;accent-color:var(--olive)}.done .txt{text-decoration:line-through;color:#9ba194}.item .txt{flex:1}.tiny{font-size:12px;color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:30px;background:#f1f2e9;font-size:12px}.progress{height:10px;border-radius:20px;background:#edf0e9;overflow:hidden}.progress b{display:block;height:100%;background:var(--olive);width:0;transition:.3s}.dogbox{display:flex;align-items:center;gap:12px;min-width:240px}.track{height:58px;position:relative;flex:1;min-width:160px;border-bottom:3px dashed #ffffffa8}.dog{position:absolute;left:0;bottom:0;font-size:34px;transition:left .5s}.ball{position:absolute;right:0;bottom:0;font-size:25px}.stat{font-size:27px;font-weight:800}.tabs{display:none}.section{display:none}.section.active{display:block}.formline{display:flex;gap:8px;margin:10px 0}.formline>*{flex:1}.formline button{flex:0 0 auto}.listcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.subcard{background:#f8f9f5;border-radius:16px;padding:13px}.subcard h3{font-size:15px}.daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.daygrid div{text-align:center;padding:8px 2px;border-radius:8px;background:#f1f3ed;font-size:11px}.daygrid .yes{background:#cbd09b}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.danger{background:#f4e3dc;color:#874d3b}.soft{background:#f4f5ef}.english-text{line-height:1.8;background:#f8f9f5;padding:15px;border-radius:15px}.word{background:#f1f0dc;border-radius:6px;padding:1px 4px}.photo{height:145px;border-radius:13px;background:#eff1e9;display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.hidden{display:none!important}.footer{padding:25px 5px;text-align:center;color:var(--muted);font-size:12px}
@media(max-width:760px){.app{padding:13px 12px 88px}.top{display:block}.top .nav{display:none}.hero{padding:20px;display:block}.dogbox{margin-top:12px}.grid{gap:10px}.s8,.s7,.s6,.s5,.s4,.s3{grid-column:span 12}.tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;z-index:5;overflow:auto;padding:7px;gap:5px;box-shadow:0 -5px 20px #3331}.tabs button{flex:1;min-width:65px;font-size:10px;padding:9px 5px}.formline{flex-wrap:wrap}.formline>*{min-width:40%}.daygrid{grid-template-columns:repeat(7,minmax(0,1fr))}}

/* Life OS — GitHub Pages edition */
:root{--bg:#E3E7DE;--card:#fff;--sand:#E2D5BB;--olive:#b9b560;--terra:#aa6d51;--ink:#263323;--muted:#818779;--line:#e9ece5;--shadow:0 12px 34px #39433312}
body{background:radial-gradient(ellipse at 12% 0%,#f7f7f1 0,transparent 34%),var(--bg);letter-spacing:-.015em}
.app{max-width:1440px;padding:24px 30px 38px}
.top{align-items:flex-start;gap:24px;margin-bottom:22px}
.brand{font-size:25px;letter-spacing:-.06em;color:var(--ink);white-space:nowrap}
.brand span{color:var(--terra)}
.nav{gap:6px;justify-content:flex-end}
.nav button{border-radius:30px;background:#ffffffb8;color:#53604e;padding:10px 14px;font-size:12px;transition:.2s}
.nav button.active{background:var(--ink);color:#fff;box-shadow:0 5px 15px #26332325}
.hero{position:relative;overflow:hidden;background:linear-gradient(115deg,#e8d4c5 0%,#e6dfc9 47%,#c9cba9 100%);border:1px solid #ffffffa6;min-height:190px;padding:30px 34px;border-radius:30px;box-shadow:var(--shadow)}
.hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff55;border-radius:50%;right:12%;top:-160px;box-shadow:0 0 0 24px #ffffff15,0 0 0 50px #ffffff10}
.hero h1{font-size:clamp(30px,4vw,46px);letter-spacing:-.06em;color:#263323;margin:8px 0}
.hero>div:first-child{position:relative;z-index:1}
.dogbox{position:relative;z-index:1;min-width:min(46%,430px);gap:16px}
.track{height:94px;border-bottom:2px dashed #fff9;min-width:210px}
.dog{position:absolute;left:0;bottom:-3px;width:82px;height:78px;transition:left .65s cubic-bezier(.2,.8,.2,1);filter:drop-shadow(0 5px 3px #26332320);overflow:visible}
.dog.running{animation:dogRun .42s ease-in-out 3}
@keyframes dogRun{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-9px) rotate(-4deg)}50%{transform:translateY(0) rotate(2deg)}75%{transform:translateY(-5px) rotate(-2deg)}}
.ball{position:absolute;right:0;bottom:0;font-size:25px;filter:drop-shadow(0 3px 2px #3332)}
.dogscore{min-width:76px}
.card{border:1px solid #fff;box-shadow:var(--shadow);border-radius:24px;padding:22px;transition:transform .18s,box-shadow .18s}
.card h2{font-size:18px;letter-spacing:-.04em;color:var(--ink)}
button{background:var(--sand);border-radius:14px;transition:transform .15s,filter .15s}
button:active{transform:scale(.97)}
button.soft,.nav button{background:#f2f4ee}
button.danger{background:#f4e7df;color:#925d48}
input,textarea,select{border-color:#e8ebe3;border-radius:13px}
input:focus,textarea:focus,select:focus{border-color:var(--olive);box-shadow:0 0 0 3px #b9b56020}
.pill{background:#f1f0e4;color:#62634b}
.progress b{background:linear-gradient(90deg,var(--terra),var(--olive))}
.item{gap:11px}
.item button{padding:7px 10px}
.subcard{background:#f7f8f4;border:1px solid #edf0e9;border-radius:18px}
.english-text{background:#f7f8f4;border:1px solid #edf0e9}
.footer{padding-bottom:18px}
@media(min-width:761px){
 .app{display:grid;grid-template-columns:220px minmax(0,1fr);column-gap:24px}
 .top{grid-column:1;grid-row:1 / span 3;position:sticky;top:18px;display:flex;flex-direction:column;align-items:stretch;height:calc(100vh - 36px);padding:18px 12px;background:#ffffffa6;border:1px solid #fff;border-radius:26px;box-shadow:var(--shadow)}
 .top .nav{display:flex;flex-direction:column;align-items:stretch;margin-top:20px}
 .top .nav button{text-align:left;padding:13px 15px}
 .hero{grid-column:2;grid-row:1}
 #main{grid-column:2;grid-row:2}
 .footer{grid-column:2;grid-row:3}
 .tabs{display:none!important}
}
@media(max-width:760px){
 .app{padding:12px 12px 96px}
 .top{display:block;padding:5px 3px}
 .brand{font-size:22px}
 .top .nav{display:none}
 .hero{padding:22px 20px;min-height:0}
 .hero h1{font-size:30px}
 .dogbox{min-width:0;margin-top:18px}
 .track{height:84px}
 .dog{width:76px;height:73px}
 .card{padding:17px;border-radius:21px}
 .tabs{background:#fffdf8f2;backdrop-filter:blur(18px);border-top:1px solid #e7e9e2;box-shadow:0 -8px 24px #39433312;padding:8px 5px calc(8px + env(safe-area-inset-bottom));}
 .tabs button{border-radius:13px;min-width:58px;font-size:10px;color:#56604f}
 .tabs button.active{background:var(--ink);color:white}
 .footer{padding-bottom:10px}
}
</style>
</head>
<body><div class="app">
<header class="top"><div class="brand">life<span>OS</span> <small class="muted">· твой личный кабинет</small></div><nav class="nav" id="topnav"></nav></header>
<section class="hero"><div><div class="muted" id="today"></div><h1 id="greeting">Добро пожаловать!</h1><div>Маленькие шаги складываются в большую жизнь ✨</div></div><div class="dogbox"><div class="track" id="dogtrack">
<svg class="dog" id="dog" viewBox="0 0 120 92" role="img" aria-label="Нарисованный йоркширский терьер">
<ellipse cx="58" cy="79" rx="37" ry="6" fill="#263323" opacity=".12"/>
<path d="M26 55 Q13 48 17 36 Q25 37 34 49" fill="#8D6545" stroke="#61452F" stroke-width="2"/>
<path d="M31 50 Q26 27 42 25 Q58 17 76 31 Q94 33 93 55 Q91 75 66 76 L43 73 Q29 68 31 50Z" fill="#B98B61" stroke="#76583D" stroke-width="2"/>
<path d="M39 34 Q25 11 33 5 Q48 8 52 31Z" fill="#76513A" stroke="#5B402F" stroke-width="2"/>
<path d="M69 31 Q78 7 94 10 Q101 25 83 43Z" fill="#76513A" stroke="#5B402F" stroke-width="2"/>
<path d="M37 43 Q44 29 61 31 Q76 30 86 44 Q87 62 69 69 Q49 73 37 58Z" fill="#D6B18A"/>
<path d="M41 48 Q49 42 56 48" fill="none" stroke="#3B3027" stroke-width="3" stroke-linecap="round"/>
<path d="M67 47 Q75 41 81 47" fill="none" stroke="#3B3027" stroke-width="3" stroke-linecap="round"/>
<ellipse cx="61" cy="59" rx="5" ry="4" fill="#30251F"/>
<path d="M57 64 Q62 69 68 64" fill="none" stroke="#76513A" stroke-width="2" stroke-linecap="round"/>
<path d="M39 70 L34 84 M77 72 L82 84" stroke="#76513A" stroke-width="6" stroke-linecap="round"/>
<path d="M46 28 Q57 21 68 30" fill="none" stroke="#E5C79D" stroke-width="5" stroke-linecap="round"/>
<path d="M35 39 Q42 33 48 37 M78 37 Q85 32 90 40" fill="none" stroke="#D9B27E" stroke-width="5" stroke-linecap="round"/>
</svg><span class="ball">🔴</span></div><div class="dogscore"><div class="stat" id="points">0</div><div class="tiny">баллов</div><div class="tiny" id="dogstage">первый шаг</div></div></div></section>
<main id="main"></main><div class="footer">Твои планы, идеи и маленькие победы — в одном месте ♡</div></div><nav class="tabs" id="bottomnav"></nav>
<script>
const sections=[['home','Главная','⌂'],['tasks','Неделя','▦'],['habits','Привычки','✓'],['work','Работа','✦'],['english','English','A'],['health','Здоровье','♡'],['life','Моя жизнь','☼'],['rewards','Награды','★'],['settings','Настройки','⚙']];
const defaults={tasks:[],habits:[{name:'Спорт · 1 час в день',log:{}},{name:'Mind saturation session · 1 час',log:{}},{name:'Просыпаться в 7:00',log:{}}],projects:[],dictionary:[],ideas:[],posts:[],wishlist:[],vision:[],affirmations:[],rewards:[],spent:[],journal:{},energy:{},englishLevel:0,focusTotal:0,focusSessions:[],points:0,closedDays:[],health:{},notes:{}};
let data=load(),page='home',timer=null,remaining=0,focusStarted=null;
function load(){try{return {...structuredClone(defaults),...JSON.parse(localStorage.getItem('lifeos')||'{}')}}catch(e){return structuredClone(defaults)}}
function save(){localStorage.setItem('lifeos',JSON.stringify(data));renderHeader()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function id(){return Date.now()+Math.random().toString(16).slice(2)}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(d){return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'})}
function nav(){let h=sections.map(([k,n,ic])=>`<button class="${page===k?'active':''}" onclick="go('${k}')">${ic} ${n}</button>`).join('');document.getElementById('topnav').innerHTML=h;document.getElementById('bottomnav').innerHTML=h}
function go(p){page=p;nav();render()}
let lastDogStage=-1;
function renderHeader(){document.getElementById('today').textContent=fmt(today());let hr=new Date().getHours();document.getElementById('greeting').textContent=(hr<12?'Доброе утро':hr<18?'Хорошего дня':'Добрый вечер')+'!';document.getElementById('points').textContent=data.points||0;let total=data.tasks.filter(t=>t.date===today()).length,done=data.tasks.filter(t=>t.date===today()&&t.done).length;let pct=total?done/total:0;let stage=total?Math.floor(pct*4):0;let dog=document.getElementById('dog');dog.style.left=(pct*78)+'%';document.getElementById('dogstage').textContent=total?(done===total?'финиш! 🏆':`этап ${Math.min(4,stage+1)} из 4`):'ждёт первую задачу';if(lastDogStage!==-1&&stage!==lastDogStage){dog.classList.remove('running');void dog.getBoundingClientRect();dog.classList.add('running')}lastDogStage=stage}
function addTask(){let text=document.getElementById('newtask').value.trim();if(!text)return;data.tasks.push({id:id(),text,date:document.getElementById('taskdate').value||today(),slot:document.getElementById('taskslot').value,done:false});save();render()}
function toggleTask(i){let t=data.tasks[i];t.done=!t.done;data.points=Math.max(0,(data.points||0)+(t.done?1:-1));save();render()}
function delTask(i){data.tasks.splice(i,1);save();render()}
function editTask(i){let t=data.tasks[i],v=prompt('Изменить задачу',t.text);if(v!==null){t.text=v;save();render()}}
function addHabit(){let v=document.getElementById('habitnew').value.trim();if(v){data.habits.push({name:v,log:{}});save();render()}}
function habitToggle(i){let h=data.habits[i],d=today();h.log[d]=!h.log[d];save();render()}
function habitStreak(h){let n=0,d=new Date();while(h.log[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}
function closeDay(){if(!data.closedDays.includes(today())){data.closedDays.push(today());data.points+=5;save();alert('День закрыт! +5 баллов ✨')}else alert('Этот день уже закрыт.')}
function addProject(){let n=prompt('Название нового проекта');if(n&&n.trim()){data.projects.push({id:id(),name:n.trim(),folders:['Основные материалы','Юридическая часть','Сторителлинги','Продуктовая линейка','Ценовая декомпозиция','Прогрев','Как улучшить','Другое'].map(name=>({name,notes:''}))});save();render()}}
function projectEdit(i){let n=prompt('Название проекта',data.projects[i].name);if(n){data.projects[i].name=n;save();render()}}
function folderEdit(pi,fi){let f=data.projects[pi].folders[fi],v=prompt(f.name+' — материалы и заметки',f.notes);if(v!==null){f.notes=v;save();render()}}
function addWord(){let w=document.getElementById('word').value.trim(),tr=document.getElementById('translation').value.trim();if(w&&tr){data.dictionary.push({w,tr,emoji:document.getElementById('emoji').value||'💡'});save();render()}}
function addIdea(){let v=document.getElementById('idea').value.trim();if(v){data.ideas.push(v);save();render()}}
function addWish(){let v=document.getElementById('wish').value.trim();if(v){data.wishlist.push({id:id(),name:v,price:0,saved:0,url:''});save();render()}}
function addReward(){let n=document.getElementById('rewardname').value.trim(),p=+document.getElementById('rewardprice').value;if(n&&p>0){data.rewards.push({name:n,price:p});save();render()}}
function redeem(i){let r=data.rewards[i];if(data.points>=r.price&&confirm('Обменять '+r.price+' баллов на «'+r.name+'»?')){data.points-=r.price;data.spent.push({name:r.name,date:today()});save();render()}else if(data.points<r.price)alert('Пока не хватает баллов 💛')}
function addVision(){let title=document.getElementById('visiontitle').value.trim(),url=document.getElementById('visionurl').value.trim(),aff=document.getElementById('visionaff').value.trim();if(title){data.vision.push({title,url,aff});save();render()}}
function addAff(){let v=document.getElementById('aff').value.trim();if(v){data.affirmations.push(v);save();render()}}
function addPost(){let platform=document.getElementById('platform').value,title=document.getElementById('posttitle').value.trim(),date=document.getElementById('postdate').value;if(title){data.posts.push({platform,title,date});save();render()}}
function addFocus(){let mins=+document.getElementById('focusmins').value||25,task=document.getElementById('focustask').value||'Своя задача';if(timer)clearInterval(timer);remaining=mins*60;focusStarted=Date.now();document.getElementById('timerdisplay').textContent=clock(remaining);timer=setInterval(()=>{remaining--;document.getElementById('timerdisplay').textContent=clock(remaining);if(remaining<=0){clearInterval(timer);timer=null;finishFocus(task,mins);alert('Фокус-сессия завершена! Отличная работа.')}},1000);document.getElementById('timerstatus').textContent='В фокусе: '+task}
function clock(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stopFocus(){if(timer){clearInterval(timer);timer=null;let elapsed=Math.max(1,Math.round((Date.now()-focusStarted)/60000));finishFocus(document.getElementById('focustask').value||'Своя задача',elapsed);document.getElementById('timerstatus').textContent='Сессия остановлена'}}
function finishFocus(task,mins){data.focusTotal+=mins;data.focusSessions.push({date:today(),task,mins});save()}
function render(){
renderHeader();nav();let m=document.getElementById('main');
if(page==='home')m.innerHTML=home();
if(page==='tasks')m.innerHTML=tasksPage();
if(page==='habits')m.innerHTML=habitsPage();
if(page==='work')m.innerHTML=workPage();
if(page==='english')m.innerHTML=englishPage();
if(page==='health')m.innerHTML=healthPage();
if(page==='life')m.innerHTML=lifePage();
if(page==='rewards')m.innerHTML=rewardsPage();
if(page==='settings')m.innerHTML=settingsPage();
}
function home(){let todays=data.tasks.filter(t=>t.date===today()),done=todays.filter(t=>t.done).length,energy=data.energy[today()]||{e:3,m:3,main:''},journal=data.journal[today()]||{good:'',move:''};return `<div class="grid">
<div class="card s8"><div class="bar"><h2>☀️ Старт дня</h2><span class="pill">${done}/${todays.length} задач</span></div><div class="row"><label class="tiny">Энергия · 1–5<input type="range" min="1" max="5" value="${energy.e}" oninput="setEnergy('e',this.value)"></label><label class="tiny">Настроение · 1–5<input type="range" min="1" max="5" value="${energy.m}" oninput="setEnergy('m',this.value)"></label></div><p class="tiny">Главное дело дня</p><input value="${esc(energy.main)}" placeholder="Самое важное сегодня…" onchange="setEnergy('main',this.value)"><h3 style="margin-top:20px">План на сегодня</h3>${taskRows(todays)}<div class="formline"><input id="newtask" placeholder="Добавить задачу…"><input id="taskdate" type="date" value="${today()}"><select id="taskslot"><option>Утро</option><option>День</option><option>Вечер</option></select><button onclick="addTask()">＋</button></div></div>
<div class="card s4"><h2>⏱ Фокус</h2><div class="stat" id="timerdisplay">25:00</div><p class="tiny" id="timerstatus">Время фокуса за всё время: ${data.focusTotal} мин</p><input id="focusmins" type="number" min="1" value="25" placeholder="Минуты"><select id="focustask">${data.tasks.map(t=>`<option>${esc(t.text)}</option>`).join('')}<option>Своя задача</option></select><div class="formline"><button onclick="addFocus()">Старт</button><button class="danger" onclick="stopFocus()">Стоп</button></div></div>
<div class="card s6"><h2>🌱 Привычки сегодня</h2>${data.habits.slice(0,5).map((h,i)=>`<div class="item"><input type="checkbox" ${h.log[today()]?'checked':''} onchange="habitToggle(${i})"><span class="txt">${esc(h.name)}</span><span class="pill">🔥 ${habitStreak(h)}</span></div>`).join('')||'<p class="muted">Добавь привычки в соответствующем разделе.</p>'}<button class="soft" onclick="go('habits')">Все привычки →</button></div>
<div class="card s6"><h2>📖 English word</h2>${data.dictionary.length?`<div class="stat">${esc(data.dictionary[data.dictionary.length-1].emoji)} ${esc(data.dictionary[data.dictionary.length-1].w)}</div><p>${esc(data.dictionary[data.dictionary.length-1].tr)}</p>`:'<p class="muted">Добавь слова в разделе English — они появятся здесь.</p>'}<button class="soft" onclick="go('english')">Учить английский →</button></div>
<div class="card s12"><h2>🌙 Итог дня</h2><div class="row"><label class="tiny">Что получилось?<textarea onchange="setJournal('good',this.value)">${esc(journal.good)}</textarea></label><label class="tiny">Что перенести / улучшить?<textarea onchange="setJournal('move',this.value)">${esc(journal.move)}</textarea></label></div><button onclick="closeDay()">Закрыть день · +5 баллов</button></div></div>`}
function setEnergy(k,v){data.energy[today()]??={e:3,m:3,main:''};data.energy[today()][k]=k==='main'?v:+v;save()}
function setJournal(k,v){data.journal[today()]??={good:'',move:''};data.journal[today()][k]=v;save()}
function taskRows(arr){return arr.length?arr.map(t=>{let i=data.tasks.indexOf(t);return `<div class="item ${t.done?'done':''}"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask(${i})"><span class="txt">${esc(t.text)} <span class="tiny">· ${esc(t.slot||'')}</span></span><button class="soft" onclick="editTask(${i})">✎</button><button class="danger" onclick="delTask(${i})">×</button></div>`}).join(''):'<p class="muted">Пока задач нет — добавь первую ниже.</p>'}
function tasksPage(){let start=new Date();start.setDate(start.getDate()-start.getDay()+1);let days=Array.from({length:7},(_,i)=>{let d=new Date(start);d.setDate(start.getDate()+i);return d.toISOString().slice(0,10)});return `<div class="card"><div class="bar"><h2>▦ Неделя и задачи</h2><span class="pill">${data.tasks.filter(t=>t.done).length} выполнено</span></div><div class="listcards">${days.map(d=>`<div class="subcard"><h3>${new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'short'})}</h3>${taskRows(data.tasks.filter(t=>t.date===d))}<button class="soft" onclick="document.getElementById('taskdate2').value='${d}';document.getElementById('newtask2').focus()">＋ Задача</button></div>`).join('')}</div><div class="formline"><input id="newtask2" placeholder="Новая задача"><input id="taskdate2" type="date" value="${today()}"><select id="taskslot2"><option>Утро</option><option>День</option><option>Вечер</option></select><button onclick="let x=document.getElementById('newtask2').value;if(x){data.tasks.push({id:id(),text:x,date:document.getElementById('taskdate2').value,slot:document.getElementById('taskslot2').value,done:false});save();render()}">Добавить</button></div><p class="tiny">Отмечай галочкой, редактируй или удаляй задачи. Выполненные задачи зачёркиваются.</p></div>`}
function habitsPage(){return `<div class="card"><div class="bar"><h2>🌱 Мои привычки</h2><span class="pill">${data.habits.length} привычек</span></div><div class="formline"><input id="habitnew" placeholder="Новая привычка"><button onclick="addHabit()">Добавить</button></div>${data.habits.map((h,i)=>`<div class="subcard" style="margin:10px 0"><div class="bar"><b>${esc(h.name)}</b><span class="pill">🔥 ${habitStreak(h)} дней подряд</span></div><div class="item"><input type="checkbox" ${h.log[today()]?'checked':''} onchange="habitToggle(${i})"><span class="txt">Сегодня выполнено</span><button class="danger" onclick="data.habits.splice(${i},1);save();render()">Удалить</button></div><p class="tiny">Трекер месяца</p><div class="daygrid">${Array.from({length:new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()},(_,j)=>{let d=new Date(new Date().getFullYear(),new Date().getMonth(),j+1).toISOString().slice(0,10);return `<div class="${h.log[d]?'yes':''}">${j+1}${h.log[d]?' ✓':''}</div>`}).join('')}</div></div>`).join('')}</div>`}
function workPage(){return `<div class="grid"><div class="card s5"><h2>📁 Проекты</h2><button onclick="addProject()">＋ Новый проект</button><p class="tiny">Каждый проект получает собственные независимые папки.</p>${data.projects.map((p,i)=>`<div class="subcard" style="margin:8px 0"><div class="bar"><b>${esc(p.name)}</b><button class="soft" onclick="projectEdit(${i})">✎</button></div>${p.folders.map((f,j)=>`<div class="item"><span class="txt">${esc(f.name)} ${f.notes?'📎':''}</span><button class="soft" onclick="folderEdit(${i},${j})">Открыть</button></div>`).join('')}<button class="danger" onclick="if(confirm('Удалить проект?')){data.projects.splice(${i},1);save();render()}">Удалить проект</button></div>`).join('')}</div><div class="card s7"><h2>📣 Продюсер · контент-план</h2><div class="formline"><select id="platform"><option>Instagram</option><option>YouTube</option><option>Telegram</option></select><input id="posttitle" placeholder="Тема публикации"><input id="postdate" type="date"><button onclick="addPost()">＋</button></div>${data.posts.map((p,i)=>`<div class="item"><span class="txt"><b>${esc(p.platform)}</b> · ${esc(p.title)} <span class="tiny">${esc(p.date)}</span></span><button class="danger" onclick="data.posts.splice(${i},1);save();render()">×</button></div>`).join('')}<h3 style="margin-top:20px">💡 Банк идей</h3><div class="formline"><input id="idea" placeholder="Записать идею…"><button onclick="addIdea()">Добавить</button></div>${data.ideas.map((x,i)=>`<div class="item"><span class="txt">${esc(x)}</span><button class="danger" onclick="data.ideas.splice(${i},1);save();render()">×</button></div>`).join('')}</div></div>`}
const lessons=[{title:'A day that went well',text:'Yesterday, I had a busy but lovely day. I woke up early and made a simple breakfast. After that, I worked on an important project and answered a few messages. In the afternoon, I went for a walk because I wanted to get some fresh air. In the evening, I studied English for thirty minutes. I felt proud because I finished the most important tasks.' ,q:'What did the person do in the afternoon?',a:'went for a walk',level:'A2'},{title:'Building a better routine',text:'A good routine does not need to be perfect. It is more useful to choose a few small habits and repeat them regularly. For example, you can plan your day in the morning, take short breaks, and read a little before bed. When you miss a day, do not give up. Notice what made it difficult and try again tomorrow. Progress often comes from simple actions.' ,q:'What should you do if you miss a day?',a:'try again tomorrow',level:'A2+'},{title:'Learning through experience',text:'When people learn a new skill, they often expect quick results. However, real progress usually takes time. It helps to set a clear goal, practise consistently, and reflect on what is working. Mistakes are not a sign of failure; they show us what we still need to understand. Over time, small improvements can lead to meaningful changes.' ,q:'What can mistakes show us?',a:'what we still need to understand',level:'B1'},{title:'Making thoughtful decisions',text:'Before making an important decision, it can be helpful to consider both short-term comfort and long-term benefits. Asking for advice may offer a fresh perspective, but the final choice should reflect your own priorities. You do not need to predict every possible outcome. Instead, gather enough information, think about the risks, and choose the next practical step.' ,q:'What should the final choice reflect?',a:'your own priorities',level:'B1+'}];
function englishPage(){let ix=Math.min(lessons.length-1,data.englishLevel||0),l=lessons[ix];return `<div class="grid"><div class="card s8"><div class="bar"><h2>🇬🇧 Английский · ${l.level}</h2><span class="pill">30 минут в день</span></div><h3>${l.title}</h3><div class="english-text">${l.text.split(' ').map(w=>`<span>${esc(w)} </span>`).join('')}</div><p><b>Вопрос:</b> ${l.q}</p><input id="answer" placeholder="Write your answer in English"><div class="formline"><button onclick="let a=document.getElementById('answer').value.toLowerCase();alert(a.includes('${l.a}')?'Отлично! Правильно 🎉':'Попробуй ещё раз. Подсказка: ответ есть в тексте.')">Проверить ответ</button><button class="soft" onclick="data.englishLevel=Math.min(3,(data.englishLevel||0)+1);save();render()">Следующий уровень →</button></div><p class="tiny">Уровень повышается по мере прохождения текстов: A2 → A2+ → B1 → B1+.</p><h3>Вставь свой текст</h3><textarea id="customtext" placeholder="Вставь любой английский текст — выдели незнакомые слова, добавь их в словарь…"></textarea><button onclick="let t=document.getElementById('customtext').value.trim();if(t){let words=t.match(/\\b[A-Za-z]{5,}\\b/g)||[];alert('В тексте найдено слов для изучения: '+[...new Set(words)].slice(0,15).join(', '))}">Найти слова</button></div><div class="card s4"><h2>📚 Мой словарь</h2><div class="formline"><input id="word" placeholder="Word"><input id="translation" placeholder="Перевод"></div><div class="formline"><input id="emoji" placeholder="Эмодзи" value="💡"><button onclick="addWord()">Добавить</button></div>${data.dictionary.map((w,i)=>`<div class="item"><span class="txt">${esc(w.emoji)} <b>${esc(w.w)}</b> — ${esc(w.tr)}</span><button class="soft" onclick="speechSynthesis.speak(new SpeechSynthesisUtterance('${esc(w.w)}'))">🔊</button><button class="danger" onclick="data.dictionary.splice(${i},1);save();render()">×</button></div>`).join('')}</div></div>`}
function healthPage(){let h=data.health[today()]||{water:0,food:'',training:'',symptoms:''};return `<div class="grid"><div class="card s6"><h2>💧 Вода</h2><div class="stat">${h.water||0} / 8</div><div class="formline"><button onclick="healthSet('water',Math.min(8,(h.water||0)+1))">＋ Стакан воды</button><button class="soft" onclick="healthSet('water',0)">Сбросить</button></div><h3>Питание</h3><textarea onchange="healthSet('food',this.value)" placeholder="Что ела сегодня…">${esc(h.food)}</textarea></div><div class="card s6"><h2>🏃 Тренировка</h2><textarea onchange="healthSet('training',this.value)" placeholder="План / тренировка недели…">${esc(h.training)}</textarea><h3>Самочувствие и симптомы</h3><textarea onchange="healthSet('symptoms',this.value)" placeholder="Отметь самочувствие…">${esc(h.symptoms)}</textarea></div><div class="card s12"><h2>🌸 Цикл</h2><p class="muted">Отметь первый день цикла. Расчёт будет ориентировочным — длительность цикла можно изменить.</p><div class="formline"><label class="tiny">Начало последнего цикла<input type="date" id="cycle" value="${esc(data.cycleStart||'')}"></label><label class="tiny">Средняя длина цикла (дней)<input type="number" id="cyclelen" min="20" max="45" value="${data.cycleLen||28}"></label><button onclick="data.cycleStart=document.getElementById('cycle').value;data.cycleLen=+document.getElementById('cyclelen').value;save();render()">Сохранить</button></div>${cycleInfo()}</div></div>`}
function healthSet(k,v){data.health[today()]??={water:0,food:'',training:'',symptoms:''};data.health[today()][k]=v;save()}
function cycleInfo(){if(!data.cycleStart)return '<p class="muted">Дата начала пока не указана.</p>';let days=Math.floor((new Date(today())-new Date(data.cycleStart+'T00:00:00'))/86400000),len=data.cycleLen||28,day=days%len+1,phase=day<=5?'Менструальная фаза':day<=(len/2-2)?'Фолликулярная фаза':day<=(len/2+2)?'Овуляторное окно':'Лютеиновая фаза';return `<p>Примерный день цикла: <b>${day}</b> · ${phase}</p><p class="tiny">Это календарная оценка, не медицинский прогноз. Индивидуальные циклы могут отличаться.</p>`}
function lifePage(){return `<div class="grid"><div class="card s7"><h2>☼ Карта желаний</h2><div class="formline"><input id="visiontitle" placeholder="Название мечты / цели"><input id="visionurl" placeholder="Ссылка на фото (необязательно)"></div><div class="formline"><input id="visionaff" placeholder="Аффирмация к фотографии"><button onclick="addVision()">Добавить</button></div><div class="listcards">${data.vision.map((v,i)=>`<div class="subcard"><div class="photo">${v.url?`<img src="${esc(v.url)}" onerror="this.parentElement.textContent='🌄'">`:'🌄'}</div><h3>${esc(v.title)}</h3><p>${esc(v.aff)}</p><button class="danger" onclick="data.vision.splice(${i},1);save();render()">Удалить</button></div>`).join('')}</div><p class="tiny">Пока можно добавлять изображения по ссылке. Загрузка файлов и облачное хранение фото подключаются на следующем этапе.</p></div><div class="card s5"><h2>💌 Аффирмации</h2><div class="formline"><input id="aff" placeholder="Я могу…"><button onclick="addAff()">＋</button></div>${data.affirmations.map((a,i)=>`<div class="item"><span class="txt">${esc(a)}</span><button class="danger" onclick="data.affirmations.splice(${i},1);save();render()">×</button></div>`).join('')||'<p class="muted">Добавь фразы, которые поддерживают тебя.</p>'}<h2 style="margin-top:25px">🎁 Вишлист</h2><div class="formline"><input id="wish" placeholder="Что хочется?"><button onclick="addWish()">＋</button></div>${data.wishlist.map((w,i)=>`<div class="subcard"><b>${esc(w.name)}</b><div class="formline"><input type="number" value="${w.price||0}" placeholder="Цена" onchange="data.wishlist[${i}].price=+this.value;save()"><input type="number" value="${w.saved||0}" placeholder="Накоплено" onchange="data.wishlist[${i}].saved=+this.value;save()"></div><div class="progress"><b style="width:${w.price?Math.min(100,w.saved/w.price*100):0}%"></b></div><button class="danger" onclick="data.wishlist.splice(${i},1);save();render()">Удалить</button></div>`).join('')}</div></div>`}
function rewardsPage(){return `<div class="grid"><div class="card s6"><h2>🏆 Магазин наград</h2><p>Баланс: <b>${data.points} баллов</b></p><div class="formline"><input id="rewardname" placeholder="Награда для себя"><input id="rewardprice" type="number" min="1" placeholder="Цена в баллах"><button onclick="addReward()">＋</button></div>${data.rewards.map((r,i)=>`<div class="item"><span class="txt">🎁 ${esc(r.name)} · ${r.price} баллов</span><button onclick="redeem(${i})">Получить</button><button class="danger" onclick="data.rewards.splice(${i},1);save();render()">×</button></div>`).join('')}</div><div class="card s6"><h2>✨ История наград</h2>${data.spent.map(x=>`<div class="item"><span class="txt">${esc(x.name)}</span><span class="tiny">${esc(x.date)}</span></div>`).join('')||'<p class="muted">Твои награды будут появляться здесь.</p>'}<p class="tiny">+1 балл за задачу, +5 за закрытый день.</p></div></div>`}
function settingsPage(){return `<div class="grid"><div class="card s6"><h2>💾 Резервная копия</h2><p class="muted">Сохрани все данные в файл или восстанови их из ранее созданной копии.</p><button onclick="exportData()">Экспортировать все данные</button><p><input type="file" accept="application/json" onchange="importData(event)"></p></div><div class="card s6"><h2>☁️ Автоматическая синхронизация</h2><p class="muted">Для синхронизации между компьютером и телефоном нужен личный облачный проект Firebase. Создай проект и вставь сюда его настройки. Данные будут храниться в приватном документе.</p><label class="tiny">Firebase config (JSON)<textarea id="fbconfig" placeholder='{"apiKey":"…","authDomain":"…","projectId":"…","appId":"…"}'>${esc(localStorage.getItem('lifeos_fbconfig')||'')}</textarea></label><div class="formline"><input id="fbemail" type="email" placeholder="Твоя почта для входа"><input id="fbpass" type="password" placeholder="Пароль (от 6 символов)"></div><div class="formline"><button onclick="connectFirebase(false)">Войти и синхронизировать</button><button class="soft" onclick="connectFirebase(true)">Создать аккаунт</button></div><p id="cloudstatus" class="tiny">${localStorage.getItem('lifeos_cloudstatus')||'Облако пока не подключено. Сейчас данные сохраняются на этом устройстве.'}</p></div><div class="card s12"><h2>Как это работает</h2><p>Изменения сохраняются автоматически в браузере. Экспортируй резервную копию время от времени. После подключения одного и того же Firebase-проекта на двух устройствах данные будут синхронизироваться через облако.</p><button class="danger" onclick="if(confirm('Удалить все данные из этого браузера? Сначала сделай экспорт.')){localStorage.removeItem('lifeos');data=structuredClone(defaults);save();render()}">Очистить данные на этом устройстве</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-life-os-backup.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{data={...structuredClone(defaults),...JSON.parse(r.result)};save();render();alert('Данные восстановлены!')}catch(err){alert('Не удалось прочитать файл.')}};r.readAsText(f)}
async function connectFirebase(createAccount){let status=document.getElementById('cloudstatus');try{let cfg=JSON.parse(document.getElementById('fbconfig').value);if(!cfg.apiKey||!cfg.projectId||!cfg.appId)throw Error('В конфигурации не хватает apiKey, projectId или appId.');localStorage.setItem('lifeos_fbconfig',JSON.stringify(cfg));status.textContent='Подключаемся…';await loadFirebase(cfg,createAccount);status.textContent='☁️ Облако подключено. Синхронизация активна.';localStorage.setItem('lifeos_cloudstatus',status.textContent)}catch(e){status.textContent='Не подключено: '+e.message+' · Локальное сохранение продолжает работать.'}}
let cloudDb=null,cloudUser=null,cloudTimer=null,cloudUnsub=null,applyingRemote=false;
async function loadFirebase(cfg,createAccount){if(!window.firebase){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js';s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
let app=firebase.apps.length?firebase.app():firebase.initializeApp(cfg);let auth=firebase.auth(app);let email=document.getElementById('fbemail').value.trim(),password=document.getElementById('fbpass').value;if(!email||password.length<6)throw Error('Введи почту и пароль минимум из 6 символов.');let credential=createAccount?await auth.createUserWithEmailAndPassword(email,password):await auth.signInWithEmailAndPassword(email,password);cloudUser=credential.user;cloudDb=firebase.firestore(app);let ref=cloudDb.collection('lifeosUsers').doc(cloudUser.uid);let snap=await ref.get();if(snap.exists){let remote=snap.data().payload;if(remote&&confirm('В облаке уже есть данные. Загрузить их на это устройство?')){data={...structuredClone(defaults),...remote};localStorage.setItem('lifeos',JSON.stringify(data));render()}}else await ref.set({payload:data,updatedAt:Date.now()});if(cloudUnsub)cloudUnsub();cloudUnsub=ref.onSnapshot(s=>{if(!s.exists)return;let remote=s.data().payload;if(remote){let remoteStamp=s.data().updatedAt||0;let localStamp=+(localStorage.getItem('lifeos_cloud_stamp')||0);if(remoteStamp>localStamp){applyingRemote=true;data={...structuredClone(defaults),...remote};localStorage.setItem('lifeos',JSON.stringify(data));localStorage.setItem('lifeos_cloud_stamp',String(remoteStamp));render();applyingRemote=false;let st=document.getElementById('cloudstatus');if(st)st.textContent='☁️ Синхронизировано · '+new Date(remoteStamp).toLocaleTimeString('ru-RU')}}},e=>{let st=document.getElementById('cloudstatus');if(st)st.textContent='Ошибка синхронизации: '+e.message});ref.set({payload:data,updatedAt:Date.now()},{merge:true});}
let originalSave=save;save=function(){originalSave();if(cloudDb&&cloudUser&&!applyingRemote){cloudDb.collection('lifeosUsers').doc(cloudUser.uid).set({payload:data,updatedAt:Date.now()}).catch(e=>{let s=document.getElementById('cloudstatus');if(s)s.textContent='Ошибка облачной записи: '+e.message})}}
render();nav();
</script></body></html>
